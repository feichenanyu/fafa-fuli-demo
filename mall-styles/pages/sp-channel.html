<script>
(function(){
  var st={tab:'rec',page:0};
  var F={isRec:function(){return st.tab==='rec'},notRec:function(){return st.tab!=='rec'},isMarket:function(){return st.tab==='market'},notMarket:function(){return st.tab!=='market'},
         isP0:function(){return st.page===0},notP0:function(){return st.page!==0},isP1:function(){return st.page===1},notP1:function(){return st.page!==1}};
  var track=document.querySelector('.swipe');
  function render(){document.querySelectorAll('[data-if]').forEach(function(el){var f=F[el.getAttribute('data-if')];el.style.display=(f&&f())?'contents':'none';});}
  function go(i){if(track)track.scrollTo({left:i*track.clientWidth,behavior:'smooth'});}
  document.addEventListener('click',function(e){var a=e.target.closest('[data-act]');if(!a)return;var k=a.getAttribute('data-act');
    if(k==='pickRec'){st.tab='rec';st.page=0;}else if(k==='pickMarket'){st.tab='market';}else if(k==='go0'){go(0);}else if(k==='go1'){go(1);}
    render(); if(k==='pickRec'||k==='pickMarket'){track=document.querySelector('[data-if="isRec"] .swipe')||document.querySelector('.swipe');}});
  if(track){track.addEventListener('scroll',function(){var p=Math.round(track.scrollLeft/track.clientWidth);if(p!==st.page){st.page=p;render();}});
    var d=null;track.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')return;d={x:e.clientX,l:track.scrollLeft,m:false};track.style.scrollSnapType='none';});
    window.addEventListener('pointermove',function(e){if(!d)return;var dx=e.clientX-d.x;if(Math.abs(dx)>4)d.m=true;track.scrollLeft=d.l-dx;});
    window.addEventListener('pointerup',function(){if(!d)return;var m=d.m;d=null;track.style.scrollSnapType='x mandatory';go(Math.round(track.scrollLeft/track.clientWidth));
      if(m){track.addEventListener('click',function c(ev){ev.preventDefault();ev.stopPropagation();track.removeEventListener('click',c,true);},true);}});}
  render();
})();
</script>
