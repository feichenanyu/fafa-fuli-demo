function saveProj(id){

/* ---------------- 合并项目 ---------------- */
let mergeKeep=null;
function openMerge(){
  const ids=Object.keys(S.sel).filter(k=>S.sel[k]);
  if(ids.length>10){toast('一次最多合并 10 个项目');return}
  const ps=ids.map(i=>PROJECTS.find(p=>p.id===i));
  mergeKeep=[...ps].sort((a,b)=>pGmv(b)-pGmv(a))[0].id;
  drawMerge(ps);
}
function drawMerge(ps){
  closeM();
  const keep=ps.find(p=>p.id===mergeKeep);
  const nm=ps.reduce((s,p)=>s+p.malls.length,0), ni=INQ.filter(i=>i.mall&&ps.some(p=>p.malls.includes(i.mall))).length;
  const typeDiff=new Set(ps.map(p=>p.type)).size>1;
  modal(`<div class="modal"><div class="mh">合并项目<span class="x" onclick="closeM()">✕</span></div><div class="mb">
   <div class="note" style="margin-bottom:10px">选择保留哪个项目的名称和信息（默认交易额最大的）。其他项目的空字段会用于补齐保留项目，创建时间取最早的一个。</div>
   ${ps.map(p=>`<div class="radio-row ${p.id===mergeKeep?'on':''}" onclick="mergeKeep='${p.id}';drawMerge(PROJECTS.filter(x=>${JSON.stringify(ps.map(q=>q.id))}.includes(x.id)))"><input type="radio" ${p.id===mergeKeep?'checked':''}><div style="flex:1"><div style="font-weight:600">${esc(p.name)}</div><div class="sub2">${p.type} · ${p.ct||'客户类型未填'} · ${p.malls.length} 个商城 · 交易额 ${fmt(pGmv(p))}</div></div></div>`).join('')}
   ${typeDiff?`<div class="tip" style="margin-top:8px"><span style="flex:1">项目类型不一致，合并后以保留项目（${keep.type}）为准</span></div>`:''}
   <div class="tip info" style="margin-top:8px"><span style="flex:1">合并后，${nm} 个商城、${ni} 个询价单和全部订单将归到「${esc(keep.name)}」，其他项目将被删除。</span></div>
  </div><div class="mf"><button class="btn" onclick="closeM()">取消</button><button class="btn pri" onclick="doMerge(${JSON.stringify(ps.map(q=>q.id)).replace(/"/g,"'")})">确认合并</button></div></div>`);
}
function doMerge(ids){
  const keep=PROJECTS.find(p=>p.id===mergeKeep);const others=PROJECTS.filter(p=>ids.includes(p.id)&&p.id!==mergeKeep);
  others.forEach(o=>{keep.malls.push(...o.malls);['ct','bt','bud'].forEach(k=>{if(!keep[k]&&o[k]){keep[k]=o[k];if(k==='ct')keep.ctSrc=o.ctSrc}});if(o.created<keep.created)keep.created=o.created;if(o.last>keep.last)keep.last=o.last;keep.profit+=o.profit});
  PROJECTS=PROJECTS.filter(p=>!others.includes(p));S.sel={};closeM();toast(`已合并 ${ids.length} 个项目`);go('project',keep.id);
}

  const i=INQ.find(x=>x.id===id);closeM();
  const m=document.createElement('div');m.className='mask';m.id='mask';m.style.justifyContent='flex-end';m.addEventListener('click',e=>{if(e.target===m)closeM()});
  m.innerHTML=`<div class="drawer"><div class="mh" style="padding:16px 20px;border-bottom:1px solid var(--line2);display:flex;font-weight:700">询价单 ${i.id}<span class="x" style="margin-left:auto;cursor:pointer;color:var(--mute)" onclick="closeM()">✕</span></div>
   <div style="padding:16px 20px"><div class="info" style="grid-template-columns:1fr 1fr">
    <div><div class="l">状态</div><div class="v"><span class="st ${i.st==='待跟进'?'w':i.st==='跟进中'?'p':'c'}">${i.st}</span>${i.closeR?`<span class="note">（${i.closeR}）</span>`:''}</div></div>
    <div><div class="l">询价类型</div><div class="v">${i.kind}</div></div>
    <div><div class="l">提交人</div><div class="v">${i.by}</div></div><div><div class="l">提交时间</div><div class="v">${i.t}</div></div>
   </div>
   <div class="sect" style="margin-top:18px">商城 / 项目</div>
   ${i.mall?`<div>${esc(mallBy(i.mall).name)}<div class="sub2">项目：<a onclick="closeM();go('project','${projOfMall(i.mall).id}')">${esc(projOfMall(i.mall).name)}</a></div></div>`
   :`<div class="tip">这个询价单还没关联商城，关联后会归到对应项目</div><div class="row"><select class="inp" id="lk" style="flex:1"><option value="">选择商城</option>${MALLS.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><button class="btn pri" onclick="linkInq('${i.id}')">关联</button></div>`}
   <div class="sect" style="margin-top:18px">商品明细</div><div>${esc(i.goods)}${i.n>1?` 等 ${i.n} 件`:''}</div>
   <div class="sect" style="margin-top:18px">跟进说明</div><div class="note">${i.note||'运营暂未回复'}</div>
   <div class="sect" style="margin-top:18px">状态记录</div><div class="note">${i.t} 提交询价${i.st!=='待跟进'?'<br>2026-11-08 16:02 运营开始跟进':''}${i.st==='已关闭'?'<br>2026-11-04 10:00 已关闭':''}</div>
   </div></div>`;
  document.body.appendChild(m);
}
function linkInq(id){const v=document.getElementById('lk').value;if(!v){toast('请选择商城');return}INQ.find(x=>x.id===id).mall=v;closeM();toast('已关联，询价单已归到项目');render()}

/* ---------------- 老页面（提示条） ---------------- */
function oldTip(k){return S.tips[k]?'':`<div class="tip info">现在也可以在「项目」里按甲方查看商城、询价和订单　<a onclick="go('projects')">去看看</a><span class="x" onclick="S.tips['${k}']=1;render()">✕</span></div>`}
function pgOldMall(){return `<div class="crumb">工作台 / 商城 / 我的商城</div><div class="h1">我的商城</div>${oldTip('mall')}<div class="old-page">原有「我的商城」页面（本版不变）<div class="note">演示：老页面顶部的新入口提示，关闭后不再出现</div></div>`}
function pgOldBi(){return `<div class="crumb">工作台 / 数据 / 经营概览</div><div class="h1">经营概览</div>${oldTip('bi')}<div class="old-page">原有「经营概览」页面（本版不变）</div>`}

/* ---------------- 首页会员面板 ---------------- */
const QALL=['全品类代发','代发订单','我的商城','售后管理','定价策略','数据看板','我的项目','询价单','商城订单','发票管理'];
let homeScene='s1';
function homePanel(){
  const pl=PALLETS.find(p=>p.id===homeScene);
  return `<div style="max-width:1320px;margin:16px auto;padding:0 24px">
   <div class="note" style="margin-bottom:8px">会员首页 = 年货节版场景运营首页（完整规则见场景运营 Spec / 年货节 Demo v2）；本 Demo 演示它与工作台的衔接</div>
   ${ctxBar()}
   <div style="display:flex;gap:16px;align-items:flex-start">
   <div style="flex:1;min-width:0">
    ${bannerHtml()}
    <div class="card" style="margin-bottom:12px"><div class="row" style="flex-wrap:wrap;gap:8px"><b style="margin-right:8px">场景</b>${PALLETS.map(p=>`<span class="tag ${p.id===homeScene?'t':''}" style="cursor:pointer;font-size:13px;padding:4px 10px" onclick="homeScene='${p.id}';render()">${esc(p.name)}${p.live?' ·档期':''}</span>`).join('')}</div></div>
    <div id="goods-anchor"></div>${goodsBlock(pl)}
   </div>
   <aside class="panel" id="panel" style="flex:0 0 300px">
    <div class="row"><b>杭州某福利科技有限公司</b><span class="sp"></span><span class="note">切换</span></div>
    <div class="todo">
     <button><b>3</b><span class="note">站点待支付订单</span></button><button><b>1</b><span class="note">待审批售后</span></button>
     <button><b>0</b><span class="note">代发异常单</span></button><button onclick="go('inquiries',{st:'open'})"><b style="color:var(--red)">${INQ.filter(i=>i.st!=='已关闭').length}</b><span class="note">询价单（待处理）</span></button>
    </div>
    <div style="height:1px;background:var(--line2)"></div>
    <div class="row"><b>企业工作台</b><span class="sp"></span><a id="qedit" onclick="openQuick()">编辑</a>　<a onclick="go('wb')">全部 ›</a></div>
    ${S.homeBubble?`<div class="bubble" style="top:218px;right:16px"><span class="bx" onclick="S.homeBubble=false;render()">✕</span>新增「我的项目」「询价单」，点「编辑」可加入常用</div>`:''}
    <div class="qk" style="${S.homeBubble?'margin-top:56px':''}">${S.quick.map(q=>`<button onclick="${q==='我的项目'?"go('projects')":q==='询价单'?"go('inquiries')":`toast('${q}：原有页面')`}"><span class="ic">${q[0]}</span>${q}</button>`).join('')}</div>
   </aside></div></div>`;
}
function openQuick(){
  S.homeBubble=false;render();window._qs=[...S.quick];
  modal(`<div class="modal" style="width:480px"><div class="mh">编辑常用功能<span class="x" onclick="closeM()">✕</span></div><div class="mb"><div class="note" style="margin-bottom:10px">最多 6 个，由你自己选择</div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${QALL.map(q=>`<label class="chk ${_qs.includes(q)?'on':''}" onclick="qT('${q}',this,event)"><input type="checkbox" ${_qs.includes(q)?'checked':''}> ${q}${['我的项目','询价单'].includes(q)?' <span class="new" style="margin-left:4px">NEW</span>':''}</label>`).join('')}</div></div>
   <div class="mf"><button class="btn" onclick="closeM()">取消</button><button class="btn pri" onclick="S.quick=_qs;closeM();render()">保存</button></div></div>`);
}
function qT(q,el,e){e.preventDefault();const i=_qs.indexOf(q);if(i>=0)_qs.splice(i,1);else{if(_qs.length>=6){toast('最多 6 个');return}_qs.push(q)}el.classList.toggle('on');el.querySelector('input').checked=_qs.includes(q)}

/* ---------------- 新手指引 ---------------- */
const STEPS=[
 {el:'g-banner',t:'年货节热门货盘',d:'运营推荐的当季热门货盘，点进去就能选货上架'},
 {el:'nav-projects',t:'按甲方看生意',d:'你的商城已按项目整理好，商城、询价、订单和账都在一页'},
 {el:'nav-inquiries',t:'询价进度在这里',d:'提交的询价单和跟进状态都能在这里看到'},
 {el:'guideBtn',t:'随时重看',d:'忘了入口在哪，点这里再看一遍'},
];
let gi=0;
function startGuide(force){
  if(!force&&S.guideDone)return;
  if(route==='home-panel'||!document.getElementById('nav-projects')){route='wb';render()}
  gi=0;S.bannerFold=false;render();
  const g=document.createElement('div');g.id='guide';g.innerHTML='<div class="gmask"></div><div class="ghole" id="ghole"></div><div class="gpop" id="gpop"></div>';document.body.appendChild(g);drawStep();
}
function drawStep(){
  const steps=STEPS.filter(s=>document.getElementById(s.el));
  const s=steps[gi];const r=document.getElementById(s.el).getBoundingClientRect();
  const h=document.getElementById('ghole');h.style.left=(r.left-6)+'px';h.style.top=(r.top-6)+'px';h.style.width=(r.width+12)+'px';h.style.height=(r.height+12)+'px';
  const p=document.getElementById('gpop');
  let left=r.right+16,top=r.top;if(left+300>innerWidth){left=Math.max(16,r.right-300);top=r.bottom+16}
  p.style.left=left+'px';p.style.top=top+'px';
  p.innerHTML=`<div class="gt">${s.t}</div><div class="gd">${s.d}</div><div class="row"><span class="gs">${gi+1} / ${steps.length}</span><span class="sp"></span><button class="btn sm link" onclick="endGuide()">跳过</button><button class="btn sm pri" onclick="${gi===steps.length-1?'endGuide()':'gi++;drawStep()'}">${gi===steps.length-1?'知道了':'下一步'}</button></div>`;
}
function endGuide(){S.guideDone=true;const g=document.getElementById('guide');g&&g.remove()}
function resetDemo(){S.guideDone=false;S.newSeen={};S.tips={};S.homeBubble=true;S.bannerFold=false;go('wb');setTimeout(()=>startGuide(),200)}

render();
setTimeout(()=>startGuide(),400);
window.addEventListener('resize',()=>{if(document.getElementById('guide'))drawStep()});
</script>
</body>
