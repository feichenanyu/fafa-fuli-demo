<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>会员工作台（改版后） · 会员端工作台精简改版 Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc-src">
<helmet>
<style>
body{margin:0;background:#F3F5F7}
a{color:#0B7A70;text-decoration:none}a:hover{color:#075E56}
button{font-family:inherit}
</style>
</helmet>
<div data-prd-root="1" style="position: relative; display: flex; align-items: stretch; background: #F7F8FC">
<div style="flex: 1 1 960px; min-width: 0; position: relative; z-index: 0; overflow: hidden">
<div style="position: relative; font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; color: #1F2329; background: #F3F5F7; min-height: 1600px; font-size: 14px">
  <template data-sc="if" value="{{tourOn}}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="position: absolute; inset: 0; z-index: 50"></div></template>

  <div style="position: relative; z-index: 80; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 24px; background: #1F2329; color: #FFFFFF; font-size: 13px">
    <span style="font-weight: 600">原型演示 · 权益视角</span>
    <div style="display: flex; gap: 4px; background: #3A3F45; border-radius: 8px; padding: 3px">
      <button onClick="{{setTop}}" style="{{topBtnStyle}}">最高权益</button>
      <button onClick="{{setLow}}" style="{{lowBtnStyle}}">低档权益（仅猫超代发）</button>
    </div>
    <span style="color: #C9CDD4">{{menuCountText}}</span>
    <button onClick="{{simulateLogin}}" style="margin-left: auto; height: 30px; padding: 0 12px; border: 1px solid #5FD3C6; border-radius: 6px; background: transparent; color: #5FD3C6; font-size: 13px; cursor: pointer">模拟首次登录</button>
  </div>

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; min-height: 64px; padding: 0 24px; background: #FFFFFF; border-bottom: 1px solid #E5E8EB">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="font-size: 22px; font-weight: 700; color: #0B7A70; letter-spacing: 1px">采发发</span>
      <span style="font-size: 12px; font-weight: 600; color: #FFFFFF; background: #0F8F84; border-radius: 4px; padding: 2px 6px">会员端</span>
    </div>
    <span style="width: 1px; height: 20px; background: #E5E8EB"></span>
    <a href="#" style="color: #646A73">返回首页</a>
    <nav aria-label="全局操作" style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px">
      <span data-prd="guide" style="{{guideWrapStyle}}">
        <button onClick="{{startTour}}" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border: 0; background: transparent; border-radius: 8px; color: #0B7A70; font-size: 14px; font-weight: 500; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path></svg>更新指引
          <template data-sc="if" value="{{guideDot}}" hint-placeholder-val="{{ true }}"><span aria-label="未看完" style="width: 8px; height: 8px; border-radius: 50%; background: #D92D20"></span></template>
        </button>
        <template data-sc="if" value="{{spotGuide}}" hint-placeholder-val="{{ false }}">
          <div role="dialog" aria-label="更新指引" style="position: absolute; top: calc(100% + 14px); right: 0; width: 320px; z-index: 70; background: #FFFFFF; border-radius: 12px; padding: 14px 18px 16px; box-sizing: border-box; box-shadow: 0 12px 32px rgba(0,0,0,0.28); text-align: left; font-weight: 400"><span aria-hidden="true" style="position: absolute; top: -6px; right: 40px; width: 12px; height: 12px; background: #FFFFFF; transform: rotate(45deg)"></span><div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px"><span style="font-size: 12px; font-weight: 600; color: #0B7A70">{{tStep}}</span><button onClick="{{tClose}}" aria-label="关闭指引" style="border: 0; background: transparent; color: #8F959E; font-size: 18px; width: 28px; height: 28px; cursor: pointer">×</button></div>
                <div style="font-size: 16px; font-weight: 600; color: #1F2329; margin-bottom: 6px">{{tTitle}}</div>
                <div style="font-size: 13px; color: #4E5969; line-height: 1.7; white-space: normal">{{tDesc}}</div>
                <template data-sc="if" value="{{tIsLast}}" hint-placeholder-val="{{ false }}"><a href="#" style="display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 500">查看完整新旧对照 →</a></template>
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 14px">
                  <button onClick="{{tClose}}" style="border: 0; background: transparent; color: #646A73; font-size: 13px; cursor: pointer; padding: 0">跳过</button>
                  <button onClick="{{tPrev}}" style="{{tPrevStyle}}">上一步</button>
                  <button onClick="{{tNext}}" style="height: 34px; padding: 0 16px; border-radius: 8px; border: 0; background: #0F8F84; color: #FFFFFF; font-size: 13px; font-weight: 500; cursor: pointer">{{tNextLabel}}</button>
                </div></div>
        </template>
      </span>
      <a href="#" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; color: #1F2329; border-radius: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>导入导出</a>
      <a href="#" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; color: #1F2329; border-radius: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2"></rect><path d="m9 13 2 2 4-4"></path></svg>审批</a>
      <a href="#" aria-label="消息，3 条未读" style="position: relative; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; color: #1F2329; border-radius: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>消息
        <span style="min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #D92D20; color: #FFFFFF; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">3</span></a>
      <span style="width: 1px; height: 18px; background: #E5E8EB; margin: 0 6px"></span>
      <a href="#" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; color: #1F2329; border-radius: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"></path><rect x="3" y="14" width="4" height="6" rx="1"></rect><rect x="17" y="14" width="4" height="6" rx="1"></rect></svg>咨询客服</a>
      <a href="#" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; color: #1F2329; border-radius: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path></svg>企业控制台</a>
      <span style="width: 1px; height: 18px; background: #E5E8EB; margin: 0 6px"></span>
      <a href="#" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; color: #1F2329; font-weight: 500">三院
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></a>
    </nav>
  </header>

  <div style="display: flex; flex-wrap: wrap; align-items: flex-start">

    <aside data-prd="menu" aria-label="主菜单" style="flex: 1 1 248px; max-width: 264px; background: #FFFFFF; border-right: 1px solid #E5E8EB; padding: 14px 12px 24px; box-sizing: border-box; align-self: stretch">
      <label style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid #E5E8EB; border-radius: 8px; background: #F7F8FA; color: #646A73; margin-bottom: 8px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input type="search" placeholder="搜索菜单，如：代发订单" aria-label="搜索菜单" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 13px; font-family: inherit; color: #1F2329">
      </label>

      <template data-sc="for" list="{{groups}}" as="g" hint-placeholder-count="8">
        <div style="border-bottom: 1px solid #F0F1F2; padding: 4px 0">
          <template data-sc="if" value="{{g.isLink}}" hint-placeholder-val="{{ false }}">
            <a href="#" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; background: #E8F6F4; color: #0B7A70; font-size: 15px; font-weight: 600">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"></path></svg>{{g.name}}</a>
          </template>
          <template data-sc="if" value="{{g.isGroup}}" hint-placeholder-val="{{ true }}">
            <button onClick="{{g.toggle}}" aria-expanded="{{g.open}}" style="display: flex; align-items: center; gap: 8px; width: 100%; height: 40px; padding: 0 10px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; color: #1F2329; text-align: left">
              {{g.name}}
              <template data-sc="if" value="{{g.hasHint}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 500; color: #646A73; background: #F2F3F5; border-radius: 4px; padding: 1px 6px">{{g.hint}}</span></template>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8F959E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{g.chevStyle}}"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <template data-sc="if" value="{{g.open}}" hint-placeholder-val="{{ true }}">
              <div style="padding: 0 0 6px">
                <template data-sc="for" list="{{g.sections}}" as="s" hint-placeholder-count="2">
                  <div style="{{s.wrapStyle}}">
                    <template data-sc="if" value="{{s.spot}}" hint-placeholder-val="{{ false }}">
                      <div role="dialog" aria-label="更新指引" style="position: absolute; left: calc(100% + 22px); top: 0; width: 320px; z-index: 70; background: #FFFFFF; border-radius: 12px; padding: 14px 18px 16px; box-sizing: border-box; box-shadow: 0 12px 32px rgba(0,0,0,0.28); text-align: left; font-weight: 400"><span aria-hidden="true" style="position: absolute; left: -6px; top: 20px; width: 12px; height: 12px; background: #FFFFFF; transform: rotate(45deg)"></span><div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px"><span style="font-size: 12px; font-weight: 600; color: #0B7A70">{{tStep}}</span><button onClick="{{tClose}}" aria-label="关闭指引" style="border: 0; background: transparent; color: #8F959E; font-size: 18px; width: 28px; height: 28px; cursor: pointer">×</button></div>
                <div style="font-size: 16px; font-weight: 600; color: #1F2329; margin-bottom: 6px">{{tTitle}}</div>
                <div style="font-size: 13px; color: #4E5969; line-height: 1.7; white-space: normal">{{tDesc}}</div>
                <template data-sc="if" value="{{tIsLast}}" hint-placeholder-val="{{ false }}"><a href="#" style="display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 500">查看完整新旧对照 →</a></template>
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 14px">
                  <button onClick="{{tClose}}" style="border: 0; background: transparent; color: #646A73; font-size: 13px; cursor: pointer; padding: 0">跳过</button>
                  <button onClick="{{tPrev}}" style="{{tPrevStyle}}">上一步</button>
                  <button onClick="{{tNext}}" style="height: 34px; padding: 0 16px; border-radius: 8px; border: 0; background: #0F8F84; color: #FFFFFF; font-size: 13px; font-weight: 500; cursor: pointer">{{tNextLabel}}</button>
                </div></div>
                    </template>
                    <template data-sc="if" value="{{s.hasTitle}}" hint-placeholder-val="{{ true }}">
                      <div style="padding: 8px 10px 4px; font-size: 12px; font-weight: 600; color: #646A73">{{s.title}}</div>
                    </template>
                    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 4px; padding: 0 2px">
                      <template data-sc="for" list="{{s.items}}" as="it" hint-placeholder-count="2">
                        <a href="{{it.href}}" title="{{it.tip}}" style="{{it.style}}"><span style="overflow: hidden; text-overflow: ellipsis">{{it.name}}</span><template data-sc="if" value="{{it.isNew}}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 10px; font-weight: 600; color: #FFFFFF; background: #E8590C; border-radius: 3px; padding: 0 4px; line-height: 16px">新</span></template><template data-sc="if" value="{{it.isRenamed}}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 10px; font-weight: 600; color: #0B7A70; background: #E8F6F4; border-radius: 3px; padding: 0 4px; line-height: 16px">改</span></template></a>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </template>
        </div>
      </template>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; padding: 20px 24px 40px; box-sizing: border-box">

      <template data-sc="if" value="{{showBanner}}" hint-placeholder-val="{{ true }}">
        <div data-prd="banner" role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; background: #E8F6F4; border: 1px solid #B5E0DA; border-radius: 10px; margin-bottom: 16px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7A70" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01"></path><path d="M11 12h1v4h1"></path></svg>
          <template data-sc="if" value="{{isTop}}" hint-placeholder-val="{{ true }}">
            <div style="flex: 1 1 420px; min-width: 0; line-height: 1.6; color: #1F2329"><b>代发入口已合并：</b>「猫超代发」「其他代发」合并为「订单 › 代发」，两套历史订单都在「代发订单」查看。新增平台猫超<b>售后（含上门取件）</b>和<b>理赔</b>，在「订单 › 售后理赔」处理。</div>
          </template>
          <template data-sc="if" value="{{isLow}}" hint-placeholder-val="{{ false }}">
            <div style="flex: 1 1 420px; min-width: 0; line-height: 1.6; color: #1F2329"><b>菜单有调整：</b>「猫超代发」已改为「订单 › 代发」，原「下单管理」改名为「代发订单」。新增平台猫超<b>售后（含上门取件）</b>和<b>理赔</b>，在「订单 › 售后理赔」处理。</div>
          </template>
          <button onClick="{{startTour}}" style="height: 32px; padding: 0 14px; border-radius: 8px; border: 0; background: #0F8F84; color: #FFFFFF; font-size: 13px; font-weight: 500; cursor: pointer">开始指引</button>
          <a href="#" style="font-size: 13px">完整说明</a>
          <button onClick="{{closeBanner}}" aria-label="关闭提示" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; background: transparent; border-radius: 6px; cursor: pointer; color: #646A73">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </div>
      </template>

      <section data-prd="todo" aria-labelledby="todo-h" style="{{todoSecStyle}}">
        <template data-sc="if" value="{{spotTodo}}" hint-placeholder-val="{{ false }}">
          <div role="dialog" aria-label="更新指引" style="position: absolute; top: calc(100% + 16px); left: 40px; width: 320px; z-index: 70; background: #FFFFFF; border-radius: 12px; padding: 14px 18px 16px; box-sizing: border-box; box-shadow: 0 12px 32px rgba(0,0,0,0.28); text-align: left; font-weight: 400"><span aria-hidden="true" style="position: absolute; top: -6px; left: 32px; width: 12px; height: 12px; background: #FFFFFF; transform: rotate(45deg)"></span><div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px"><span style="font-size: 12px; font-weight: 600; color: #0B7A70">{{tStep}}</span><button onClick="{{tClose}}" aria-label="关闭指引" style="border: 0; background: transparent; color: #8F959E; font-size: 18px; width: 28px; height: 28px; cursor: pointer">×</button></div>
                <div style="font-size: 16px; font-weight: 600; color: #1F2329; margin-bottom: 6px">{{tTitle}}</div>
                <div style="font-size: 13px; color: #4E5969; line-height: 1.7; white-space: normal">{{tDesc}}</div>
                <template data-sc="if" value="{{tIsLast}}" hint-placeholder-val="{{ false }}"><a href="#" style="display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 500">查看完整新旧对照 →</a></template>
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 14px">
                  <button onClick="{{tClose}}" style="border: 0; background: transparent; color: #646A73; font-size: 13px; cursor: pointer; padding: 0">跳过</button>
                  <button onClick="{{tPrev}}" style="{{tPrevStyle}}">上一步</button>
                  <button onClick="{{tNext}}" style="height: 34px; padding: 0 16px; border-radius: 8px; border: 0; background: #0F8F84; color: #FFFFFF; font-size: 13px; font-weight: 500; cursor: pointer">{{tNextLabel}}</button>
                </div></div>
        </template>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px">
          <h2 id="todo-h" style="margin: 0; font-size: 16px; font-weight: 600">待处理</h2>
          <span style="font-size: 12px; color: #646A73">数字大于 0 才着色，点整格进入对应列表</span>
          <a href="#" style="margin-left: auto; font-size: 13px">全部订单 →</a>
        </div>
        <div style="{{todoGridStyle}}">
          <template data-sc="for" list="{{todos}}" as="t" hint-placeholder-count="5">
            <a href="#" style="{{t.cardStyle}}">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: #646A73">{{t.label}}<template data-sc="if" value="{{t.hasTag}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: #0B7A70; background: #E8F6F4; border-radius: 4px; padding: 0 5px; line-height: 18px">{{t.tag}}</span></template></div>
              <div style="{{t.numStyle}}">{{t.num}}</div>
              <div style="font-size: 12px; color: #646A73; line-height: 1.5">{{t.sub}}</div>
              <template data-sc="if" value="{{t.hasSub2}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12px; color: #646A73; line-height: 1.5">{{t.sub2}}</div></template>
              <div style="margin-top: auto; padding-top: 10px; font-size: 13px; font-weight: 500; color: #0B7A70">去处理 →</div>
            </a>
          </template>
        </div>
      </section>

      <section data-prd="pallet" aria-labelledby="pallet-h" style="background: #FFFFFF; border-radius: 12px; padding: 18px 20px 20px; margin-bottom: 16px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px">
          <h2 id="pallet-h" style="margin: 0; font-size: 16px; font-weight: 600">平台货盘</h2>
          <span style="font-size: 12px; color: #646A73">运营精选货盘 · 点卡片进资源广场看明细，上架和代发都在明细页操作</span>
          <a href="#" style="margin-left: auto; font-size: 13px; font-weight: 500">去资源广场选货 →</a>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px">
          <template data-sc="for" list="{{pallets}}" as="p" hint-placeholder-count="4">
            <a href="pallet.html" style="border: 1px solid #E5E8EB; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; color: #1F2329">
              <div style="{{p.coverStyle}}">
                <div style="display: flex; flex-wrap: wrap; gap: 6px">

  prdMeasure() {
    const root = document.querySelector('[data-prd-root]');
    const box = document.querySelector('[data-prd-cards]');
    if (!root || !box) return;
    const rb = root.getBoundingClientRect();
    const sc = root.offsetWidth ? rb.width / root.offsetWidth : 1;
    const bb = box.getBoundingClientRect();
    const A = {};
    document.querySelectorAll('[data-prd]').forEach((el) => {
      const b = el.getBoundingClientRect();
      if (b.width < 2 || b.height < 2) return;
      A[el.getAttribute('data-prd')] = { x: (b.left - rb.left) / sc, y: (b.top - rb.top) / sc, w: b.width / sc, h: b.height / sc };
    });
    const H = {};
    document.querySelectorAll('[data-prd-card]').forEach((el) => { H[el.getAttribute('data-prd-card')] = el.offsetHeight; });
    const PX = (bb.left - rb.left) / sc, CY = (bb.top - rb.top) / sc;
    const key = JSON.stringify([A, H, Math.round(PX), Math.round(CY)]);
    if (key !== this._prdKey) { this._prdKey = key; this.setState({ prdA: A, prdH: H, prdPX: PX, prdCY: CY }); }
  }
  componentDidMount() { this.prdMeasure(); this._prdT = setInterval(() => this.prdMeasure(), 500); }
  componentWillUnmount() { clearInterval(this._prdT); }
  renderVals() { return Object.assign(this.pageVals(), this.prdVals()); }
  prdVals() {
    const st = this.state;
    const A = st.prdA || {}, H = st.prdH || {};
    const PX = st.prdPX || 0, CY = st.prdCY || 0;
    const focus = st.prdFocus || '';
    const cards = this.prdCards();
    const withA = cards.filter((c) => A[c.k]).sort((a, b) => A[a.k].y - A[b.k].y);
    const noA = cards.filter((c) => !A[c.k]);
    const order = withA.concat(noA);
    let y = 0; const pos = {};
    order.forEach((c) => {
      const want = A[c.k] ? Math.max(0, A[c.k].y - CY - 4) : y;
      const top = Math.max(want, y);
      pos[c.k] = top; y = top + (H[c.k] || 150) + 12;
    });
    const C1 = '#5B6BD5';
    const showLines = st.prdLines !== false;
    const prdLineList = !showLines ? [] : withA.map((c) => {
      const a = A[c.k];
      const op = focus ? (focus === c.k ? 1 : 0.15) : 0.6;
      const w = focus === c.k ? 2 : 1.5;
      const dash = w + 'px dashed ' + C1;
      const ax = a.x + a.w + 4, ay = a.y + Math.min(a.h / 2, 24);
      const gx = PX - 16, cy = CY + pos[c.k] + 20;
      return {
        box: 'position: absolute; left: ' + (a.x - 4) + 'px; top: ' + (a.y - 4) + 'px; width: ' + (a.w + 8) + 'px; height: ' + (a.h + 8) + 'px; border: ' + dash + '; border-radius: 8px; box-sizing: border-box; opacity: ' + op,
        s1: 'position: absolute; left: ' + Math.min(ax, gx) + 'px; top: ' + ay + 'px; width: ' + Math.abs(gx - ax) + 'px; border-top: ' + dash + '; opacity: ' + op,
        s2: 'position: absolute; left: ' + gx + 'px; top: ' + Math.min(ay, cy) + 'px; height: ' + Math.abs(cy - ay) + 'px; border-left: ' + dash + '; opacity: ' + op,
        s3: 'position: absolute; left: ' + gx + 'px; top: ' + cy + 'px; width: ' + (PX - gx) + 'px; border-top: ' + dash + '; opacity: ' + op,
        dot: 'position: absolute; left: ' + (ax - 4) + 'px; top: ' + (ay - 4) + 'px; width: 8px; height: 8px; border-radius: 50%; background: ' + C1 + '; opacity: ' + op
      };
    });
    const TAG = { '交互': ['#EEF2FF', '#3B4BB8'], '数据': ['#E8F6F4', '#0B6E66'], '规则': ['#F2F3F5', '#1F2329'], '埋点': ['#F5EDF7', '#7A2E78'], '待确认': ['#FFF1E8', '#B54708'] };
    const nums = {}; order.forEach((c, i) => { nums[c.k] = i + 1; });
    return {
      prdTitle: this.prdTitle(), prdIntro: this.prdIntro(),
      prdCardList: order.map((c) => {
        const on = focus === c.k;
        return {
          k: c.k, no: String(nums[c.k]), title: c.title,
          unanchored: !A[c.k], hint: c.hide || '当前界面未显示这个区域',
          secs: c.secs.map((x) => ({ label: x[0], text: x[1], tagStyle: 'flex: none; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 600; line-height: 20px; background: ' + (TAG[x[0]] || TAG['规则'])[0] + '; color: ' + (TAG[x[0]] || TAG['规则'])[1] })),
          enter: () => this.setState({ prdFocus: c.k }), leave: () => this.setState({ prdFocus: '' }),
          style: 'position: absolute; left: 16px; right: 16px; top: ' + pos[c.k] + 'px; background: #FFFFFF; border-radius: 10px; padding: 12px 14px; box-sizing: border-box; border: 1px solid ' + (on ? C1 : '#E3E6F5') + '; box-shadow: ' + (on ? '0 4px 14px rgba(91,107,213,0.18)' : 'none')
        };
      }),
      prdLineList, prdPanelH: String(Math.max(y + 24, 400)),
      prdToggleLines: () => this.setState({ prdLines: st.prdLines === false }),
      prdLinesLabel: showLines ? '隐藏连线' : '显示连线'
    };
  }

  prdTitle() { return "工作台（改版后）"; }
  prdIntro() { return "V1.3 工作台精简与代发售后整合。服务商在一个工作台里完成选货盘、代发下单和售后理赔；顶部黑条可切换权益视角。"; }
  prdCards() { return [{"k": "guide", "title": "顶栏「更新指引」", "secs": [["交互", "点击后从第 1 步重新开始代发迁移指引；指引没看完时按钮带红点。"], ["规则", "按账号记录指引状态：未开始 / 中途关闭 / 已看完。看完后红点消失，入口保留到过渡期结束。"], ["埋点", "会员端事件（不在 C 端埋点需求内，另行定义）：guide_start、guide_step_view(step)、guide_skip(step)、guide_finish。"]]}, {"k": "menu", "title": "左侧菜单", "secs": [["规则", "按六大模块组织：商品（含供应商）、商城（含卡券营销）、订单、企业码、财务、数据。名片营销、企微营销、客户整组隐藏。"], ["规则", "菜单按会员权益过滤：分组取各权益的并集，组内菜单项再按渠道权限过滤，不出现点进去为空的入口。"], ["交互", "默认展开常用 / 商品 / 商城 / 订单，其余折叠；顶部可搜索菜单；「新」「改」角标悬停显示原位置。\n旧菜单路径保留一个过渡期，访问时跳到新位置并提示一次。"], ["待确认", "过渡期时长；「常用」的默认预置项。"]]}, {"k": "banner", "title": "迁移指引条与分步指引", "secs": [["规则", "只对原来有「猫超代发」或「其他代发」菜单的账号显示。上线后首次登录工作台自动开始 5 步指引：代发 → 售后理赔 → 选货 → 待处理 → 更新指引入口。"], ["交互", "「开始指引」从第 1 步开始；「完整说明」进入迁移说明页；× 只关闭指引条，顶栏入口保留。指引中页面变暗，当前讲解区域挖亮并弹出说明卡片，可跳过、上一步、下一步。"], ["数据", "步骤文案按权益变化：低档权益不出现「其他代发」「售后代运营」。"]], "hide": "指引条已关闭，点顶栏「模拟首次登录」可恢复"}, {"k": "todo", "title": "待处理", "secs": [["数据", "待付款、待发货：商城订单。\n代发待处理：原猫超代发 + 原其他代发合并统计。\n售后·理赔：只计会员自己处理的单；已委托售后代运营的不计入，单列「另有 N 单由平台代处理」。\n商品变更待确认：变更审核 + 代发商品变更通知。"], ["规则", "按权益显示 4–5 格，格数自适应铺满一行；数字大于 0 才着色，超时类（如待发货超 24 小时）标橙。"], ["交互", "整格可点，跳到对应列表并带上筛选条件。"], ["待确认", "超时阈值；售后代运营是否覆盖平台猫超代发。"]]}, {"k": "pallet", "title": "平台货盘", "secs": [["数据", "取运营后台配置的货盘，按运营排序取前 4 个。卡片字段：名称、来源、标签（新上架 / 运营专题）、商品数、已上架商城数、说明。"], ["交互", "点卡片进入该货盘明细；「去资源广场选货」进入资源广场货盘列表。上架和代发只在明细页操作，工作台只做曝光入口。"], ["规则", "所有权益都展示，保证曝光覆盖面。"], ["埋点", "会员端事件（另行定义）：货盘卡片曝光、点击，用于看运营货盘的曝光与转化。"]]}, {"k": "biz", "title": "经营数据", "secs": [["数据", "三个页签：商城订单 / 代发订单 / 集采订单，对比上一个同长度周期。\n商城页签：商城 GMV、支付订单数、访问人数 UV、兑换转化率（支付成功人数 ÷ 已登录访问人数）、发放兑换率（已下单员工数 ÷ 项目发放员工数）。"], ["规则", "带「行为」标的指标来自 C 端新商城埋点，小时级更新；订单类指标实时。比率类指标只显示数值，不画趋势图。"], ["交互", "点指标卡切换下方每日柱状图；悬停显示当天数值；可切换成数据表；无数据时显示空状态并引导去资源广场。右上「分析报表」进入数据 › 商城分析。"]]}, {"k": "side", "title": "右侧：交易主链路与额度使用", "secs": [["数据", "F4 交易主链路 7 步，标出转化最低的一步；流失按 fail_reason 和「主动离开」拆分。"], ["数据", "员工额度分两种：商城余额 1:1 抵现金；商城积分按站点设置的比例兑换商品。跨站点汇总积分时，先按各站点比例折算成金额再相加。"], ["交互", "「完整漏斗」「看流失原因」「按项目看」进入商城分析对应页签。代发、集采页签下这里分别换成渠道构成 / 售后理赔、报价进度。"]]}]; }
