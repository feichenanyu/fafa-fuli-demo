<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>数据 › 商城分析 · 会员端工作台精简改版 Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc-src">
<helmet>
<style>
body{margin:0;background:#F3F5F7}
a{color:#0B7A70;text-decoration:none}a:hover{color:#075E56}
button,select{font-family:inherit}
</style>
</helmet>
<div data-prd-root="1" style="position: relative; display: flex; align-items: stretch; background: #F7F8FC">
<div style="flex: 1 1 960px; min-width: 0; position: relative; z-index: 0; overflow: hidden">
<div style="font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; color: #1F2329; background: #F3F5F7; min-height: 2300px; font-size: 14px">
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 24px; background: #1F2329; color: #FFFFFF; font-size: 13px">
    <span style="font-weight: 600">原型演示 · 报表视角</span>
    <div style="display: flex; gap: 4px; background: #3A3F45; border-radius: 8px; padding: 3px">
      <button onClick="{{setInternal}}" style="{{internalBtn}}">平台内部（产品 / 运营）</button>
      <button onClick="{{setProvider}}" style="{{providerBtn}}">服务商（开放后）</button>
    </div>
    <span style="color: #C9CDD4">{{viewNote}}</span>
  </div>

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; min-height: 64px; padding: 0 24px; background: #FFFFFF; border-bottom: 1px solid #E5E8EB">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="font-size: 22px; font-weight: 700; color: #0B7A70; letter-spacing: 1px">采发发</span>
      <span style="font-size: 12px; font-weight: 600; color: #FFFFFF; background: #0F8F84; border-radius: 4px; padding: 2px 6px">{{endLabel}}</span>
    </div>
    <span style="width: 1px; height: 20px; background: #E5E8EB"></span>
    <nav aria-label="面包屑" style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #646A73">
      <a href="workbench.html">{{crumbRoot}}</a><span aria-hidden="true">›</span><span>数据</span><span aria-hidden="true">›</span><span style="color: #1F2329">商城分析</span>
    </nav>
    <span style="margin-left: auto; font-size: 12px; color: #646A73">（原型省略左侧菜单，入口在「数据 › 商城分析」和工作台「分析报表」）</span>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 24px 24px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
      <div style="flex: 1 1 420px; min-width: 0">
        <h1 style="margin: 0 0 4px; font-size: 22px; font-weight: 600">商城分析</h1>
        <p style="margin: 0; font-size: 13px; color: #646A73">员工从进入商城到支付、售后的每一步，口径按《C端商城用户行为埋点与漏斗分析需求 V1.0》，数据全部来自新商城埋点（旧前端不做埋点）。报表 T+1 更新，数据截至 11/22 24:00。</p>
      </div>
      <button style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 1px solid #D0D3D6; border-radius: 8px; background: #FFFFFF; color: #1F2329; font-size: 13px; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>导出当前报表
      </button>
    </div>

    <div data-prd="filters" style="background: #FFFFFF; border-radius: 12px; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <div style="display: flex; gap: 4px; background: #F2F3F5; border-radius: 8px; padding: 3px; font-size: 13px">
        <span style="padding: 5px 10px; color: #646A73">昨天</span>
        <span style="padding: 5px 10px; border-radius: 6px; background: #FFFFFF; color: #0B7A70; font-weight: 600">近 7 天</span>
        <span style="padding: 5px 10px; color: #646A73">近 30 天</span>
        <span style="padding: 5px 10px; color: #646A73">自定义</span>
      </div>
      <template data-sc="if" value="{{showProvider}}" hint-placeholder-val="{{ true }}">
      <div data-prd="pv" style="position: relative">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #646A73">
          <span>{{pv.label}}</span>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px; width: 330px; min-height: 32px; padding: 2px 6px; border: 1px solid #D0D3D6; border-radius: 6px; background: #FFFFFF; box-sizing: border-box">
            <template data-sc="for" list="{{pv.chips}}" as="ch" hint-placeholder-count="0">
              <span style="display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 2px 0 8px; border-radius: 11px; background: #E8F6F4; color: #0B7A70; font-size: 12px; white-space: nowrap">{{ch.name}}<button onClick="{{ch.remove}}" aria-label="{{ch.aria}}" style="width: 20px; height: 20px; border: 0; background: transparent; color: #0B7A70; cursor: pointer; font-size: 14px; line-height: 1">×</button></span>
            </template>
            <input type="search" value="{{pv.query}}" onInput="{{pv.onInput}}" onFocus="{{pv.onFocus}}" placeholder="{{pv.placeholder}}" aria-label="{{pv.aria}}" style="flex: 1; min-width: 140px; height: 26px; border: 0; outline: none; background: transparent; font-size: 13px; font-family: inherit; color: #1F2329">
          </div>
          <template data-sc="if" value="{{pv.internal}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; color: #3B4BB8; background: #EEF2FF; border-radius: 3px; padding: 0 4px; line-height: 16px; white-space: nowrap">仅平台内部</span></template>
        </div>
        <template data-sc="if" value="{{pv.open}}" hint-placeholder-val="{{ false }}">
          <div role="listbox" aria-label="{{pv.aria}}" style="position: absolute; top: calc(100% + 4px); left: 0; width: 460px; max-width: calc(100vw - 48px); z-index: 30; background: #FFFFFF; border: 1px solid #E5E8EB; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.14); padding: 8px; box-sizing: border-box">
            <div style="padding: 4px 8px 8px; font-size: 12px; color: #646A73">{{pv.headText}}</div>
            <template data-sc="if" value="{{pv.hasIdHint}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 4px 6px; padding: 8px 10px; background: #F7F8FA; border-radius: 8px; font-size: 12px; color: #1F2329">
                <span>{{pv.idHint}}</span>
                <template data-sc="if" value="{{pv.hasNotFound}}" hint-placeholder-val="{{ false }}"><span style="color: #B54708">{{pv.notFoundText}}</span></template>
                <button onClick="{{pv.selectAllIds}}" style="margin-left: auto; height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: #0F8F84; color: #FFFFFF; font-size: 12px; cursor: pointer">全部选中</button>
              </div>
            </template>
            <div style="max-height: 260px; overflow-y: auto">
              <template data-sc="for" list="{{pv.results}}" as="r" hint-placeholder-count="5">
                <button role="option" aria-selected="{{r.selStr}}" onClick="{{r.toggle}}" style="{{r.style}}">
                  <span style="width: 16px; flex: none; color: #0B7A70; font-weight: 700">{{r.mark}}</span>
                  <span style="flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span>
                  <span style="flex: none; font-size: 12px; color: #646A73; font-family: ui-monospace, Menlo, monospace">{{r.id}}</span>
                  <span style="flex: none; width: 110px; text-align: right; font-size: 12px; color: #646A73; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.sub}}</span>
                </button>
              </template>
              <template data-sc="if" value="{{pv.empty}}" hint-placeholder-val="{{ false }}"><div style="padding: 16px 8px; font-size: 13px; color: #646A73; text-align: center">没有匹配的结果，换个名称或 ID 试试</div></template>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 2px; border-top: 1px solid #F0F1F2; margin-top: 6px">
              <span style="font-size: 12px; color: #646A73">{{pv.footText}}</span>
              <button onClick="{{pv.clear}}" style="margin-left: auto; height: 28px; padding: 0 10px; border: 1px solid #D0D3D6; border-radius: 6px; background: #FFFFFF; font-size: 12px; cursor: pointer; color: #1F2329">清空</button>
              <button onClick="{{pv.close}}" style="height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: #0F8F84; color: #FFFFFF; font-size: 12px; cursor: pointer">完成</button>
            </div>
          </div>
        </template>
      </div>
      </template>
      <div data-prd="ml" style="position: relative">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #646A73">
          <span>{{ml.label}}</span>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px; width: 330px; min-height: 32px; padding: 2px 6px; border: 1px solid #D0D3D6; border-radius: 6px; background: #FFFFFF; box-sizing: border-box">
            <template data-sc="for" list="{{ml.chips}}" as="ch" hint-placeholder-count="0">
              <span style="display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 2px 0 8px; border-radius: 11px; background: #E8F6F4; color: #0B7A70; font-size: 12px; white-space: nowrap">{{ch.name}}<button onClick="{{ch.remove}}" aria-label="{{ch.aria}}" style="width: 20px; height: 20px; border: 0; background: transparent; color: #0B7A70; cursor: pointer; font-size: 14px; line-height: 1">×</button></span>
            </template>
            <input type="search" value="{{ml.query}}" onInput="{{ml.onInput}}" onFocus="{{ml.onFocus}}" placeholder="{{ml.placeholder}}" aria-label="{{ml.aria}}" style="flex: 1; min-width: 140px; height: 26px; border: 0; outline: none; background: transparent; font-size: 13px; font-family: inherit; color: #1F2329">
          </div>
          <template data-sc="if" value="{{ml.internal}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; color: #3B4BB8; background: #EEF2FF; border-radius: 3px; padding: 0 4px; line-height: 16px; white-space: nowrap">仅平台内部</span></template>
        </div>
        <template data-sc="if" value="{{ml.open}}" hint-placeholder-val="{{ false }}">
          <div role="listbox" aria-label="{{ml.aria}}" style="position: absolute; top: calc(100% + 4px); left: 0; width: 460px; max-width: calc(100vw - 48px); z-index: 30; background: #FFFFFF; border: 1px solid #E5E8EB; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.14); padding: 8px; box-sizing: border-box">
            <div style="padding: 4px 8px 8px; font-size: 12px; color: #646A73">{{ml.headText}}</div>
            <template data-sc="if" value="{{ml.hasIdHint}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 4px 6px; padding: 8px 10px; background: #F7F8FA; border-radius: 8px; font-size: 12px; color: #1F2329">
                <span>{{ml.idHint}}</span>
                <template data-sc="if" value="{{ml.hasNotFound}}" hint-placeholder-val="{{ false }}"><span style="color: #B54708">{{ml.notFoundText}}</span></template>
                <button onClick="{{ml.selectAllIds}}" style="margin-left: auto; height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: #0F8F84; color: #FFFFFF; font-size: 12px; cursor: pointer">全部选中</button>
              </div>
            </template>
            <div style="max-height: 260px; overflow-y: auto">
              <template data-sc="for" list="{{ml.results}}" as="r" hint-placeholder-count="5">
                <button role="option" aria-selected="{{r.selStr}}" onClick="{{r.toggle}}" style="{{r.style}}">
                  <span style="width: 16px; flex: none; color: #0B7A70; font-weight: 700">{{r.mark}}</span>
                  <span style="flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span>
                  <span style="flex: none; font-size: 12px; color: #646A73; font-family: ui-monospace, Menlo, monospace">{{r.id}}</span>
                  <span style="flex: none; width: 110px; text-align: right; font-size: 12px; color: #646A73; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.sub}}</span>
                </button>
              </template>
              <template data-sc="if" value="{{ml.empty}}" hint-placeholder-val="{{ false }}"><div style="padding: 16px 8px; font-size: 13px; color: #646A73; text-align: center">没有匹配的结果，换个名称或 ID 试试</div></template>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 2px; border-top: 1px solid #F0F1F2; margin-top: 6px">
              <span style="font-size: 12px; color: #646A73">{{ml.footText}}</span>
              <button onClick="{{ml.clear}}" style="margin-left: auto; height: 28px; padding: 0 10px; border: 1px solid #D0D3D6; border-radius: 6px; background: #FFFFFF; font-size: 12px; cursor: pointer; color: #1F2329">清空</button>
              <button onClick="{{ml.close}}" style="height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: #0F8F84; color: #FFFFFF; font-size: 12px; cursor: pointer">完成</button>
            </div>
          </div>
        </template>
      </div>
      <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #646A73">福利项目
        <select style="height: 32px; padding: 0 8px; border: 1px solid #D0D3D6; border-radius: 6px; background: #FFFFFF; font-size: 13px; color: #1F2329"><option>全部</option><option>2026 年货节发放</option><option>11 月生日礼</option></select>
      </label>
      <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #646A73">终端
        <select style="height: 32px; padding: 0 8px; border: 1px solid #D0D3D6; border-radius: 6px; background: #FFFFFF; font-size: 13px; color: #1F2329"><option>全部</option><option>H5</option><option>微信小程序</option><option>支付宝小程序</option></select>
      </label>
      
      <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #646A73">商品渠道
        <select style="height: 32px; padding: 0 8px; border: 1px solid #D0D3D6; border-radius: 6px; background: #FFFFFF; font-size: 13px; color: #1F2329"><option>全部</option><option>平台猫超</option><option>京东</option><option>优品</option><option>自营</option></select>
      </label>
      <span style="font-size: 12px; color: #646A73">暂不支持按甲方企业统计，请按福利项目筛选</span>
    </div>

    <div data-prd="tabs" role="tablist" aria-label="报表" style="display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #E5E8EB">
      <template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="6">
        <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}<template data-sc="if" value="{{t.pending}}" hint-placeholder-val="{{ false }}"><span style="margin-left: 6px; font-size: 10px; color: #B54708; background: #FFF1E8; border-radius: 3px; padding: 0 4px; line-height: 16px">待确认开放</span></template></button>
      </template>
    </div>

    <!-- 漏斗分析 -->
    <template data-sc="if" value="{{isFunnel}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <section data-prd="funnel" aria-labelledby="fn-h" style="background: #FFFFFF; border-radius: 12px; padding: 20px 24px">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 6px">
            <h2 id="fn-h" style="margin: 0; font-size: 16px; font-weight: 600">{{fName}}</h2>
            <div style="display: flex; flex-wrap: wrap; gap: 6px">
              <template data-sc="for" list="{{funnelChips}}" as="c" hint-placeholder-count="4">
                <button onClick="{{c.pick}}" aria-pressed="{{c.selected}}" style="{{c.style}}">{{c.label}}</button>
              </template>
            </div>
          </div>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin: 10px 0 6px; font-size: 13px; color: #646A73">
            
            <label style="display: flex; align-items: center; gap: 6px">窗口期
              <select value="{{winValue}}" onChange="{{onWin}}" aria-label="窗口期" style="height: 30px; padding: 0 8px; border: 1px solid #D0D3D6; border-radius: 6px; background: #FFFFFF; font-size: 13px; color: #1F2329">
                <template data-sc="for" list="{{winOpts}}" as="o" hint-placeholder-count="2"><option value="{{o.value}}">{{o.label}}</option></template>
              </select>
            </label>
            <div role="group" aria-label="统计方式" style="display: flex; gap: 4px; background: #F2F3F5; border-radius: 8px; padding: 3px">
              <template data-sc="for" list="{{modeOpts}}" as="o" hint-placeholder-count="2"><button onClick="{{o.pick}}" disabled="{{o.disabled}}" aria-pressed="{{o.selected}}" style="{{o.style}}">{{o.label}}</button></template>
            </div>
          </div>
          <p style="margin: 0 0 14px; font-size: 12px; color: #646A73">{{fMeta}}</p>

          <template data-sc="for" list="{{funnel}}" as="f" hint-placeholder-count="7">
            <div>
              <template data-sc="if" value="{{f.hasLoss}}" hint-placeholder-val="{{ false }}">
                <div style="{{f.lossStyle}}">↓ {{f.conv}} · 流失 {{f.lost}} 人<template data-sc="if" value="{{f.worst}}" hint-placeholder-val="{{ false }}"><span style="margin-left: 8px; font-size: 11px; font-weight: 600; color: #B54708; background: #FFF1E8; border-radius: 4px; padding: 1px 6px">流失最多</span></template><template data-sc="if" value="{{f.lossLink}}" hint-placeholder-val="{{ false }}"><button onClick="{{f.goLoss}}" style="margin-left: 8px; border: 0; background: transparent; color: #0B7A70; font-size: 12px; cursor: pointer; padding: 0">看流失原因 →</button></template></div>
              </template>
              <div style="display: flex; align-items: center; gap: 16px">
                <span style="width: 150px; flex: none; font-size: 13px">{{f.label}}<span style="display: block; font-size: 11px; color: #646A73; font-family: ui-monospace, Menlo, monospace">{{f.event}}</span></span>
                <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                  <div style="{{f.shapeStyle}}" title="{{f.tip}}">{{f.inner}}</div>
                </div>
                <span style="width: 150px; flex: none; text-align: right; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">{{f.valueText}}</span>
              </div>
            </div>
          </template>
        </section>
        <div data-prd="share" style="display: flex; flex-wrap: wrap; gap: 16px">
          <template data-sc="for" list="{{shareCharts}}" as="sc" hint-placeholder-count="2">
            <section style="flex: 1 1 420px; min-width: 0; background: #FFFFFF; border-radius: 12px; padding: 20px 24px">
              <h2 style="margin: 0 0 4px; font-size: 16px; font-weight: 600">{{sc.title}}</h2>
              <p style="margin: 0 0 14px; font-size: 12px; color: #646A73">{{sc.sub}}</p>
              <template data-sc="if" value="{{sc.has}}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px">
                  <div role="img" aria-label="{{sc.aria}}" style="{{sc.donut}}">
                    <div style="position: absolute; inset: 30px; border-radius: 50%; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center">
                      <span style="font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums">{{sc.total}}</span>
                      <span style="font-size: 12px; color: #646A73">{{sc.totalLabel}}</span>
                    </div>
                  </div>
                  <div style="flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
                    <template data-sc="for" list="{{sc.rows}}" as="r" hint-placeholder-count="4">
                      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px">
                        <span style="{{r.swatch}}"></span><span>{{r.label}}</span>
                        <span style="margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap">{{r.n}} · {{r.pct}}</span>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
              <template data-sc="if" value="{{sc.none}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 40px 0; text-align: center; font-size: 13px; color: #646A73">这个漏斗不涉及商品，不看渠道占比</p></template>
            </section>
          </template>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 16px">
          <section data-prd="trend" style="flex: 3 1 520px; min-width: 0; background: #FFFFFF; border-radius: 12px; padding: 20px 24px">
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 4px">
              <h2 style="margin: 0; font-size: 16px; font-weight: 600">{{trTitle}}</h2>
              <span style="font-size: 12px; color: #646A73">{{trSub}}</span>
              <template data-sc="if" value="{{tr.hasRef}}" hint-placeholder-val="{{ true }}"><span style="margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #646A73"><span style="width: 16px; border-top: 2px dashed #7A8089"></span>{{tr.refLabel}}</span></template>
            </div>
            <div role="img" aria-label="{{tr.aria}}" style="position: relative; height: 220px; margin-top: 12px">
              <div style="position: absolute; left: 0; width: 44px; top: 10px; bottom: 24px">
                <template data-sc="for" list="{{tr.ticks}}" as="t" hint-placeholder-count="4"><span style="{{t.labelStyle}}">{{t.label}}</span></template>
              </div>
              <div style="position: absolute; left: 52px; right: 12px; top: 10px; bottom: 24px">
                <template data-sc="for" list="{{tr.ticks}}" as="t" hint-placeholder-count="4"><div style="{{t.lineStyle}}"></div></template>
                <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible">
                  <template data-sc="if" value="{{tr.hasRef}}" hint-placeholder-val="{{ true }}"><polyline points="{{tr.refPoints}}" fill="none" stroke="#7A8089" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"></polyline></template>

        统计主体默认按人去重：登录后用 user_id，登录前用 device_id，登录成功后合并为同一人。漏斗有序：先完成上一步，在窗口期内完成下一步才计入。<br>
        步骤转化率 = 本步人数 ÷ 上一步人数；兑换转化率 = 支付成功人数 ÷ 访问人数（已登录）。成功类步骤取服务端结果事件且 is_success = true。<br>
        流失：完成上一步但窗口期内没完成本步的人；有失败结果事件的按 fail_reason 归因，没有的记为主动离开，并记录离开前最后一个页面。纯积分、纯余额、积分 + 余额和 0 元订单在创单时即视为支付成功。<br>
        商城余额按 1:1 抵现金；商城积分按站点设置的比例折算，跨站点汇总积分时一律先折算成金额。<br>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2300}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'funnel', funnel: 'F4', compare: false, loss: 'cart', hour: -1, trHover: -1, lsHover: -1, view: 'internal', dim: 0, win: 0, mode: 'person', pvQ: '', mlQ: '', combo: '', pvSel: [], mlSel: [] };
  }
  pageVals() {
    const st = this.state;
    const fmt = (n) => n.toLocaleString('en-US');
    const chip = (sel) => 'height: 30px; padding: 0 12px; border-radius: 15px; border: 0; cursor: pointer; font-size: 13px; ' + (sel ? 'background: #E8F6F4; color: #0B7A70; font-weight: 600' : 'background: #F2F3F5; color: #1F2329');

    const tabs = [['funnel', '漏斗分析', true], ['loss', '流失原因', true], ['search', '搜索分析'], ['page', '页面与组件'], ['habit', '下单习惯'], ['project', '发放兑换']].map((t) => {
      const sel = st.tab === t[0];
      return { label: t[1], pending: !!t[2] && st.view === 'provider', selected: sel ? 'true' : 'false', pick: () => this.setState({ tab: t[0] }),
        style: 'display: flex; align-items: center; height: 42px; padding: 0 16px; border: 0; background: transparent; cursor: pointer; font-size: 14px; margin-bottom: -1px; ' + (sel ? 'color: #0B7A70; font-weight: 600; border-bottom: 2px solid #0F8F84' : 'color: #646A73; border-bottom: 2px solid transparent') };
    });

    const F = {
      F4: { name: 'F4 交易主链路', meta: '', unit: '人',
        steps: [['进入商城（已登录）', 'mall_enter', 1286], ['浏览商详', 'item_detail_view', 1040], ['加购成功或立即购买', 'add_cart_result / buy_now_click', 486], ['进入确认订单', 'order_confirm_view', 301], ['提交订单', 'order_submit_click', 248], ['创单成功', 'order_create_result', 236], ['支付成功', 'pay_result', 198]] },
      F5: { name: 'F5 搜索找货', meta: '', unit: '人',
        steps: [['发起搜索', 'search_submit', 684], ['有结果', 'search_result', 641], ['点击结果', 'search_result_click', 352], ['加购或立即购买', 'add_cart_result / buy_now_click', 168], ['创单成功', 'order_create_result', 89]] },
      F6: { name: 'F6 购物车', meta: '', unit: '人',
        steps: [['加购成功', 'add_cart_result', 412], ['查看购物车', 'cart_view', 380], ['点击结算', 'cart_checkout_click', 251], ['创单成功', 'order_create_result', 214], ['支付成功', 'pay_result', 186]] },
      F1: { name: 'F1 注册', platform: true, meta: '首次登录一步的窗口为 7 天', unit: '人',
        steps: [['进入注册页', 'page_view(register)', 412], ['验证码发送成功', 'register_sms_result', 389], ['提交注册', 'register_submit', 352], ['注册成功', 'register_result', 331], ['首次登录成功', 'login_result · is_first_login', 318]] },
      F2: { name: 'F2 登录', platform: true, meta: '「验证码获取成功」只适用于短信等需要验证码的方式，合计漏斗不含这一步，按登录方式拆分可见', unit: '人',
        steps: [['进入登录页', 'page_view(login)', 1520], ['提交登录', 'login_submit', 1402], ['登录成功', 'login_result', 1318]] },
      F3: { name: 'F3 游客转化', platform: true, meta: '', unit: '人',
        steps: [['游客进入', 'guest_enter', 524], ['浏览商详', 'item_detail_view', 341], ['弹出登录引导', 'login_guide_show', 198], ['登录成功', 'login_result', 126], ['创单成功', 'order_create_result', 41]] },
      F1b: { name: 'F1b 导入账号激活', meta: '', unit: '个账号', noSession: true, winDir: -1,
        steps: [['账号开通', 'account_create_result', 2040], ['首次登录成功', 'login_result · is_first_login', 1512], ['首次下单成功', 'order_create_result', 1339]] }
    };
    const WINS = { F4: ['同一自然日', '7 天'], F5: ['同一会话', '同一自然日'], F6: ['7 天', '30 天'], F1: ['30 分钟', '1 天'], F1b: ['30 天', '7 天'], F2: ['30 分钟', '1 天'], F3: ['同一自然日', '7 天'] };
    const base = F[st.funnel];
    const wins = WINS[st.funnel];
    const wi = Math.min(st.win, wins.length - 1);
    const sessionMode = st.mode === 'session' && !base.noSession;
    let counts = base.steps.map((x) => x[2]);
    if (sessionMode) counts = counts.map((v, i) => Math.round(v * 1.55 * Math.pow(0.9, i)));
    if (wi > 0) {
      const dir = base.winDir || 1;
      counts = counts.map((v, i) => i === 0 ? v : Math.round(v * (1 + dir * 0.06 * i)));
      for (let i = 1; i < counts.length; i++) counts[i] = Math.min(counts[i], counts[i - 1]);
    }
    const cur = { name: base.name, unit: sessionMode ? '次会话' : base.unit, steps: base.steps.map((x, i) => [x[0], x[1], counts[i]]) };
    const fMetaText = '窗口：' + wins[wi] + ' · ' + (sessionMode ? '按会话（session_id）计' : (base.noSession ? '按账号计' : '按人去重')) + (base.meta ? ' · ' + base.meta : '') + ' · 每层宽度与人数成正比，层间是步骤转化率' + (base.platform && st.view === 'provider' ? ' · 平台级漏斗，是否对服务商开放待确认' : '');
    const SH_PAL = ['#0F8F84', '#5B6BD5', '#C2671B', '#A0479E', '#5E8C2E'];
    const donutOf = (rows) => {
      const tot = rows.reduce((x, r) => x + r[1], 0);
      let acc2 = 0; const sg = [];
      const out = rows.map((r, i) => {
        const col = SH_PAL[i % SH_PAL.length];
        const a0 = acc2 / tot * 360, a1 = (acc2 + r[1]) / tot * 360; acc2 += r[1];
        const gap = Math.min(1.2, (a1 - a0) / 3);
        sg.push(col + ' ' + a0.toFixed(2) + 'deg ' + (a1 - gap).toFixed(2) + 'deg', '#FFFFFF ' + (a1 - gap).toFixed(2) + 'deg ' + a1.toFixed(2) + 'deg');
        return { label: r[0], n: fmt(r[1]), pct: (r[1] / tot * 100).toFixed(1) + '%', swatch: 'flex: none; width: 10px; height: 10px; border-radius: 2px; background: ' + col };
      });
      return { rows: out, total: fmt(tot), donut: 'position: relative; flex: none; width: 160px; height: 160px; border-radius: 50%; background: conic-gradient(' + sg.join(', ') + ')',
        aria: out.map((r) => r.label + ' ' + r.pct).join('，') };
    };
    const first = counts[0], last = counts[counts.length - 1];
    const termRows = [['微信小程序', Math.round(first * 0.58)], ['H5', Math.round(first * 0.34)], ['支付宝小程序', first - Math.round(first * 0.58) - Math.round(first * 0.34)]];
    const goodsFunnel = ['F4', 'F5', 'F6'].indexOf(st.funnel) >= 0;
    const chRows = [['平台猫超', Math.round(last * 0.46)], ['京东', Math.round(last * 0.31)], ['优品', Math.round(last * 0.15)]];
    chRows.push(['自营', last - chRows.reduce((x, r) => x + r[1], 0)]);
    const tD = donutOf(termRows), cD = donutOf(chRows);
    const shareCharts = [
      Object.assign({ title: '终端占比', sub: '按「' + cur.steps[0][0] + '」的' + (sessionMode ? '会话' : '人数') + '统计（platform 字段）', has: true, none: false, totalLabel: cur.unit }, tD),
      Object.assign({ title: '商品渠道占比', sub: goodsFunnel ? '按「' + cur.steps[cur.steps.length - 1][0] + '」的' + (sessionMode ? '会话' : '人数') + '统计（goods_channel 字段）' : '', has: goodsFunnel, none: !goodsFunnel, totalLabel: cur.unit }, cD)
    ];
    const s0 = cur.steps[0][2];
    let worst = 1, wc = 2;
    cur.steps.forEach((s, i) => { if (i > 0) { const c = s[2] / cur.steps[i - 1][2]; if (c < wc) { wc = c; worst = i; } } });
    const funnel = cur.steps.map((s, i) => {
      const prev = i > 0 ? cur.steps[i - 1] : null;
      return {
        label: s[0], event: s[1],
        valueText: '占首步 ' + (s[2] / s0 * 100).toFixed(1) + '%',
        inner: fmt(s[2]) + ' ' + cur.unit,
        tip: s[0] + '：' + fmt(s[2]) + ' ' + cur.unit + '，占首步 ' + (s[2] / s0 * 100).toFixed(1) + '%',
        shapeStyle: (() => {
          const w = s[2] / s0 * 100;
          const nxt = cur.steps[i + 1];
          const wn = nxt ? nxt[2] / s0 * 100 : w;
          const inset = w > 0 ? ((w - wn) / 2 / w * 100) : 0;
          return 'margin: 0 auto; height: 42px; width: ' + w.toFixed(2) + '%; min-width: 88px; background: #0F8F84; color: #FFFFFF; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: center; justify-content: center; ' +
            'clip-path: polygon(0 0, 100% 0, ' + (100 - inset).toFixed(2) + '% 100%, ' + inset.toFixed(2) + '% 100%)';
        })(),
        hasLoss: i > 0, worst: i === worst,
        lossLink: st.funnel === 'F4' && (i === 2 || i === 6),
        goLoss: () => this.setState({ tab: 'loss', loss: i === 2 ? 'cart' : 'pay' }),
        conv: prev ? (s[2] / prev[2] * 100).toFixed(1) + '%' : '',
        lost: prev ? fmt(prev[2] - s[2]) : '',
        lossStyle: 'padding: 6px 166px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; color: ' + (i === worst ? '#B54708' : '#646A73'),
        barStyle: 'height: 30px; border-radius: 6px; background: #0F8F84; width: ' + (s[2] / s0 * 100) + '%',
      };
    });
    const funnelChips = [['F4', 'F4 交易主链路'], ['F5', 'F5 搜索找货'], ['F6', 'F6 购物车'], ['F1', 'F1 注册'], ['F1b', 'F1b 导入账号激活'], ['F2', 'F2 登录'], ['F3', 'F3 游客转化']].map((c) => ({
      label: c[1], selected: st.funnel === c[0] ? 'true' : 'false', style: chip(st.funnel === c[0]),
      pick: () => this.setState({ funnel: c[0], win: 0, trHover: -1 })
    }));

    const L = {
      cart: { label: '浏览商详 → 加购', fail: [['收货地区不可售', 'not_saleable_area', 88, '换可售商品', '#'], ['商品缺货', 'out_of_stock', 62, '去资源广场补货', '#'], ['超出限购', 'limit_exceeded', 21, '', '#']],
        leave: [['商品详情', 'item_detail', 301], ['搜索结果页', 'search_result', 52], ['其他页面', 'other', 30]] },
      confirm: { label: '确认订单 → 提交', fail: [],
        leave: [['确认订单', 'order_confirm', 41], ['新增/切换地址后离开', 'order_confirm · address_edit', 12]] },
      create: { label: '提交 → 创单成功', fail: [['商城积分不足', 'points_insufficient', 5, '', '#'], ['收货地区不可售', 'not_saleable_area', 3, '换可售商品', '#'], ['商品缺货', 'out_of_stock', 2, '去资源广场补货', '#'], ['价格变动', 'price_changed', 2, '', '#']], leave: [] },
      pay: { label: '创单 → 支付成功', fail: [['用户取消支付', 'user_cancel', 21, '', '#'], ['支付超时', 'timeout', 12, '', '#'], ['商城余额不足', 'balance_insufficient', 5, '', '#']], leave: [] }
    };
    const lc = L[st.loss];
    const failMax = Math.max.apply(null, lc.fail.map((f) => f[2]).concat([1]));
    const leaveMax = Math.max.apply(null, lc.leave.map((f) => f[2]).concat([1]));
    const lFail = lc.fail.map((f) => ({ label: f[0], code: f[1], n: String(f[2]), action: f[3], href: f[4],
      barStyle: 'height: 10px; border-radius: 4px; background: #0F8F84; width: ' + (f[2] / failMax * 100) + '%' }));
    const lLeave = lc.leave.length ? lc.leave.map((f) => ({ label: f[0], code: f[1], n: String(f[2]),
      barStyle: 'height: 10px; border-radius: 4px; background: #0F8F84; width: ' + (f[2] / leaveMax * 100) + '%' }))
      : [{ label: '（无）', code: '这一步的流失都有失败结果', n: '0', barStyle: 'height: 10px; width: 0' }];
    const lossChips = Object.keys(L).map((k) => ({ label: L[k].label, selected: st.loss === k ? 'true' : 'false', style: chip(st.loss === k), pick: () => this.setState({ loss: k }) }));


    const days = ['11/16', '11/17', '11/18', '11/19', '11/20', '11/21', '11/22'];
    const makeLine = (series, opt, hoverKey) => {
      const all = series.concat(opt.ref != null ? [opt.ref] : []);
      let lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
      const step = opt.step;
      lo = Math.floor(lo / step) * step - (opt.padLo ? step : 0); if (lo < 0) lo = 0;
      hi = Math.ceil(hi / step) * step; if (hi === lo) hi = lo + step;
      const ticks = [];
      for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(v);
      const y = (v) => (v - lo) / (hi - lo) * 100;
      const n = series.length;
      const x = (i) => n > 1 ? i / (n - 1) * 100 : 50;
      const hv = st[hoverKey];
      return {
        points: series.map((v, i) => x(i).toFixed(2) + ',' + (100 - y(v)).toFixed(2)).join(' '),
        hasRef: opt.ref != null, refLabel: opt.refLabel || '',
        refPoints: opt.ref != null ? ('0,' + (100 - y(opt.ref)).toFixed(2) + ' 100,' + (100 - y(opt.ref)).toFixed(2)) : '',
        aria: opt.aria + '：' + series.map((v, i) => days[i] + ' ' + opt.fmt(v)).join('，'),
        ticks: ticks.map((v) => ({ label: opt.fmt(v),
          labelStyle: 'position: absolute; right: 0; bottom: ' + y(v) + '%; transform: translateY(50%); font-size: 12px; color: #646A73; font-variant-numeric: tabular-nums; white-space: nowrap',
          lineStyle: 'position: absolute; left: 0; right: 0; bottom: ' + y(v) + '%; border-top: 1px solid ' + (v === lo ? '#C9CDD4' : '#EEF0F2') })),
        dots: series.map((v, i) => {
          const on = hv === i;
          return { date: days[i], tip: days[i] + ' · ' + opt.fmt(v), hover: on,
            enter: () => this.setState({ [hoverKey]: i }), leave: () => this.setState({ [hoverKey]: -1 }),
            hitStyle: 'position: absolute; top: 0; bottom: 0; width: 36px; left: calc(' + x(i) + '% - 18px)',

      tr, trTitle: trc.title, trSub: trc.sub, stepBars, stepAria: '步骤转化率：' + stepBars.map((b) => b.tip).join('，'),
      lossBars, slices, lTotal: String(total), lStepLabel: L[st.loss].label,
      donutStyle: 'position: relative; flex: none; width: 180px; height: 180px; border-radius: 50%; background: conic-gradient(' + segs.join(', ') + ')',
      donutAria: '流失构成：' + slices.map((x2) => x2.label + ' ' + x2.n + ' 人 ' + x2.pct).join('，'),
      ls, lsTitle: '每日流失人数 · ' + L[st.loss].label, lsSub: '近 7 天',
      wordTables, pages, comps, hours, habitKpis, shares, projects,
      hourAria: '下单时段分布：' + hc.map((v, i) => i + '点 ' + v + ' 单').join('，')
    };
  }

  prdMeasure() {
    const root = document.querySelector('[data-prd-root]');
    const box = document.querySelector('[data-prd-cards]');
    if (!root || !box) return;
    const rb = root.getBoundingClientRect();
    const sc = root.offsetWidth ? rb.width / root.offsetWidth : 1;
    const bb = box.getBoundingClientRect();
    const A = {};
    document.querySelectorAll('[data-prd]').forEach((el) => {
      const b = el.getBoundingClientRect();
      if (b.width < 2 || b.height < 2) return;
      A[el.getAttribute('data-prd')] = { x: (b.left - rb.left) / sc, y: (b.top - rb.top) / sc, w: b.width / sc, h: b.height / sc };
    });
    const H = {};
    document.querySelectorAll('[data-prd-card]').forEach((el) => { H[el.getAttribute('data-prd-card')] = el.offsetHeight; });
    const PX = (bb.left - rb.left) / sc, CY = (bb.top - rb.top) / sc;
    const key = JSON.stringify([A, H, Math.round(PX), Math.round(CY)]);
    if (key !== this._prdKey) { this._prdKey = key; this.setState({ prdA: A, prdH: H, prdPX: PX, prdCY: CY }); }
  }
  componentDidMount() { this.prdMeasure(); this._prdT = setInterval(() => this.prdMeasure(), 500); }
  componentWillUnmount() { clearInterval(this._prdT); }
  renderVals() { return Object.assign(this.pageVals(), this.prdVals()); }
  prdVals() {
    const st = this.state;
    const A = st.prdA || {}, H = st.prdH || {};
    const PX = st.prdPX || 0, CY = st.prdCY || 0;
    const focus = st.prdFocus || '';
    const cards = this.prdCards();
    const withA = cards.filter((c) => A[c.k]).sort((a, b) => A[a.k].y - A[b.k].y);
    const noA = cards.filter((c) => !A[c.k]);
    const order = withA.concat(noA);
    let y = 0; const pos = {};
    order.forEach((c) => {
      const want = A[c.k] ? Math.max(0, A[c.k].y - CY - 4) : y;
      const top = Math.max(want, y);
      pos[c.k] = top; y = top + (H[c.k] || 150) + 12;
    });
    const C1 = '#5B6BD5';
    const showLines = st.prdLines !== false;
    const prdLineList = !showLines ? [] : withA.map((c) => {
      const a = A[c.k];
      const op = focus ? (focus === c.k ? 1 : 0.15) : 0.6;
      const w = focus === c.k ? 2 : 1.5;
      const dash = w + 'px dashed ' + C1;
      const ax = a.x + a.w + 4, ay = a.y + Math.min(a.h / 2, 24);
      const gx = PX - 16, cy = CY + pos[c.k] + 20;
      return {
        box: 'position: absolute; left: ' + (a.x - 4) + 'px; top: ' + (a.y - 4) + 'px; width: ' + (a.w + 8) + 'px; height: ' + (a.h + 8) + 'px; border: ' + dash + '; border-radius: 8px; box-sizing: border-box; opacity: ' + op,
        s1: 'position: absolute; left: ' + Math.min(ax, gx) + 'px; top: ' + ay + 'px; width: ' + Math.abs(gx - ax) + 'px; border-top: ' + dash + '; opacity: ' + op,
        s2: 'position: absolute; left: ' + gx + 'px; top: ' + Math.min(ay, cy) + 'px; height: ' + Math.abs(cy - ay) + 'px; border-left: ' + dash + '; opacity: ' + op,
        s3: 'position: absolute; left: ' + gx + 'px; top: ' + cy + 'px; width: ' + (PX - gx) + 'px; border-top: ' + dash + '; opacity: ' + op,
        dot: 'position: absolute; left: ' + (ax - 4) + 'px; top: ' + (ay - 4) + 'px; width: 8px; height: 8px; border-radius: 50%; background: ' + C1 + '; opacity: ' + op
      };
    });
    const TAG = { '交互': ['#EEF2FF', '#3B4BB8'], '数据': ['#E8F6F4', '#0B6E66'], '规则': ['#F2F3F5', '#1F2329'], '埋点': ['#F5EDF7', '#7A2E78'], '待确认': ['#FFF1E8', '#B54708'] };
    const nums = {}; order.forEach((c, i) => { nums[c.k] = i + 1; });
    return {
      prdTitle: this.prdTitle(), prdIntro: this.prdIntro(),
      prdCardList: order.map((c) => {
        const on = focus === c.k;
        return {
          k: c.k, no: String(nums[c.k]), title: c.title,
          unanchored: !A[c.k], hint: c.hide || '当前界面未显示这个区域',
          secs: c.secs.map((x) => ({ label: x[0], text: x[1], tagStyle: 'flex: none; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 600; line-height: 20px; background: ' + (TAG[x[0]] || TAG['规则'])[0] + '; color: ' + (TAG[x[0]] || TAG['规则'])[1] })),
          enter: () => this.setState({ prdFocus: c.k }), leave: () => this.setState({ prdFocus: '' }),
          style: 'position: absolute; left: 16px; right: 16px; top: ' + pos[c.k] + 'px; background: #FFFFFF; border-radius: 10px; padding: 12px 14px; box-sizing: border-box; border: 1px solid ' + (on ? C1 : '#E3E6F5') + '; box-shadow: ' + (on ? '0 4px 14px rgba(91,107,213,0.18)' : 'none')
        };
      }),
      prdLineList, prdPanelH: String(Math.max(y + 24, 400)),
      prdToggleLines: () => this.setState({ prdLines: st.prdLines === false }),
      prdLinesLabel: showLines ? '隐藏连线' : '显示连线'
    };
  }

  prdTitle() { return "数据 › 商城分析"; }
  prdIntro() { return "口径以《C端商城用户行为埋点与漏斗分析需求 V1.0》为准，数据全部来自新商城埋点。右侧卡片随页签切换。"; }
  prdCards() {
    const common = [{"k": "filters", "title": "筛选条", "secs": [["规则", "维度按需求 6.2：日期、商城、福利项目、终端、商品渠道（平台内部另有服务商）。所有数据来自新商城埋点，旧前端不做埋点、不计入。暂不支持按甲方企业统计，用福利项目代替。"], ["数据", "报表 T+1 更新，数据截至前一天 24:00。"]]}, {"k": "pv", "title": "服务商搜索（仅平台内部）", "secs": [["规则", "只在平台内部（产品 / 运营）视角显示；开放给服务商后隐藏，服务商只能看自己（member_enterprise_id 固定为当前会员企业）。"], ["交互", "按名称或企业 ID 搜索；可粘贴多个 ID（逗号、空格、换行分隔），提示匹配到几个、哪些没找到，「全部选中」一次加入。选了服务商后，商城搜索只在这些服务商名下找。"]], "hide": "服务商视角下隐藏这个筛选"}, {"k": "ml", "title": "商城搜索", "secs": [["交互", "按商城名称或商城 ID 搜索：名称模糊匹配，最多显示 20 条；ID 精确匹配，支持一次粘贴多个。选中的商城以标签显示，可逐个移除，「清空」恢复为全部。"], ["规则", "平台约 1.2 万个商城，不用下拉列表。服务商视角只搜得到自己名下的商城。"]]}, {"k": "tabs", "title": "报表页签", "secs": [["规则", "对应需求 6.3：漏斗分析、流失原因、搜索分析、页面与组件、下单习惯；另加「发放兑换」（V2.3 会员端任务）。核心看板放在工作台的经营数据里。"], ["待确认", "漏斗分析、流失原因是否对服务商开放（需求 7.3），服务商视角下页签标「待确认开放」。"]]}, {"k": "caliber", "title": "数据口径说明", "secs": [["规则", "默认按人去重：登录前用 device_id，登录后用 user_id 合并为同一人。漏斗有序：先完成上一步，在窗口期内完成下一步才计入。成功类步骤取服务端结果事件且 is_success = true。"]]}];
    const byTab = {"funnel": [{"k": "funnel", "title": "漏斗图", "secs": [["数据", "支持需求 5.2 全部 7 个漏斗：F4 交易主链路、F5 搜索找货、F6 购物车、F1 注册、F1b 导入账号激活、F2 登录、F3 游客转化；每步下方显示对应事件名。"], ["规则", "每层宽度与人数成正比；层间显示步骤转化率和流失人数，转化最低的一步标橙，可直接跳到流失原因。"], ["交互", "窗口期按漏斗切换（如 F4：同一自然日 / 7 天）；统计方式按人 / 按会话（F1b 按账号统计，不支持按会话）。"]]}, {"k": "share", "title": "终端与商品渠道占比", "secs": [["数据", "终端取 platform 字段（微信小程序 / H5 / 支付宝小程序），按漏斗第一步统计；商品渠道取 goods_channel，按漏斗最后一步统计，只在 F4 / F5 / F6 显示。"], ["规则", "这两个维度只做占比分析，不再拆分成多个漏斗。"]]}, {"k": "trend", "title": "每日转化率折线", "secs": [["数据", "跟随所选漏斗显示对应指标的每日值（F4 兑换转化率、F2 登录成功率、F1b 累计首次下单率等），虚线是上周均值。"], ["交互", "悬停显示当天数值。"]]}, {"k": "steps", "title": "步骤转化率柱状图", "secs": [["数据", "每一步相对上一步的转化率，最低的一步标橙。"]]}], "loss": [{"k": "lossBars", "title": "各步流失人数", "secs": [["数据", "F4 每一步的流失人数 = 上一步人数 − 本步人数。"], ["交互", "点柱子切换下方的流失构成和趋势；还没有原因明细的步骤显示为灰色，不能点。"]]}, {"k": "donut", "title": "流失构成", "secs": [["数据", "有失败结果事件的流失按 fail_reason（需求 6.4）归因；没有的记为「主动离开」，按离开前最后一个页面拆分；两类合在一起看占比。"]]}, {"k": "lsTrend", "title": "每日流失人数", "secs": [["数据", "所选步骤近 7 天每天的流失人数，虚线是上周日均。"]]}, {"k": "lossDetail", "title": "失败原因明细", "secs": [["交互", "能处理的原因后面带入口，如「换可售商品」「去资源广场补货」。"], ["待确认", "fail_reason 枚举是否完整；other 占比超过 5% 时需要补充枚举。"]]}], "search": [{"k": "skpi", "title": "搜索核心指标", "secs": [["数据", "搜索无结果率 = 无结果的搜索次数 ÷ 搜索总次数；搜索点击率 = 有点击的搜索请求（list_request_id）÷ 有结果的搜索次数。"]]}, {"k": "words", "title": "搜索词表", "secs": [["数据", "热词、无结果词、有结果但没点击的词；需求要求各取 Top 50，原型示意 Top 5。"], ["交互", "无结果词可以一键去资源广场找货。"]]}], "page": [{"k": "pg", "title": "页面", "secs": [["数据", "各页面的 PV、UV、平均停留时长（取 page_leave 的 duration_ms）、跳出率。"]]}, {"k": "cp", "title": "首页装修组件与坑位", "secs": [["数据", "曝光口径：元素面积一半以上进入可视区且停留满 500ms，同一页面生命周期内只报一次；点击率 = 点击 ÷ 曝光，低于 5% 标橙。"]]}], "habit": [{"k": "hr", "title": "下单时段分布", "secs": [["数据", "按小时统计创单成功数（取 server_time）。"], ["交互", "悬停显示该时段单数。"]]}, {"k": "shares", "title": "来源与支付方式", "secs": [["数据", "创单来源（order_source）、支付方式、抵扣构成、商品渠道。"], ["规则", "商城余额 1:1 抵现金；商城积分按站点比例折算成金额。"], ["待确认", "需求 4.6 的支付方式枚举（pay_method）缺余额相关取值，结果事件需新增余额抵扣金额字段（balance_amount）。"]]}], "project": [{"k": "pj", "title": "发放兑换", "secs": [["数据", "发放兑换率 = 已下单员工数 ÷ 项目发放员工数；「已激活」= 首次登录成功（对应 F1b）；额度分商城余额、商城积分两列，积分显示站点比例和折合金额。"], ["待确认", "分母「项目发放员工数」取哪张业务表（需求 7.3）。"]]}]};
    return common.slice(0, 4).concat(byTab[this.state.tab] || []).concat(common.slice(4));
  }
}
