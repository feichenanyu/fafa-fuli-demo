<head>

<template id="dc-src">
<helmet>
<style>
.ai{--bg:#F4F7F7;--card:rgba(255,255,255,.76);--solid:#FFFFFF;--bd:rgba(15,23,42,.07);--tx1:#0F172A;--tx2:#566074;--tx3:#8A94A6;--brand:#0B7A70;--accent:#0B7A70;--info:#3B4BB8;--infobg:rgba(91,107,213,.12);
 --g1:rgba(15,143,132,.20);--g2:rgba(63,196,181,.14);--g3:rgba(15,143,132,.10);--chip:rgba(15,23,42,.045);--chip2:rgba(15,23,42,.08);
 --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(15,23,42,.06);--grad:linear-gradient(120deg,#0B7A70 0%,#0F8F84 50%,#4CC1B3 100%);--gradText:linear-gradient(120deg,#075E56 0%,#0B7A70 55%,#0F8F84 100%);--gradBtn:linear-gradient(120deg,#075E56 0%,#0B7A70 100%);
 --warn:#C2410C;--warnbg:rgba(234,88,12,.10);--up:#0B7A70;--grid:rgba(15,23,42,.045);--tip:#0F172A;--tiptx:#FFFFFF;--stopA:#0B7A70;--stopB:#0F8F84;--stopC:#4CC1B3;--rail:rgba(255,255,255,.62);--glow:rgba(15,143,132,.22)}
.ai.dark{--bg:#0A0F11;--card:rgba(255,255,255,.045);--solid:#121A1C;--bd:rgba(255,255,255,.08);--tx1:#E8EEEF;--tx2:#9AA7AA;--tx3:#66757A;--brand:#3FC4B5;--accent:#3FC4B5;--info:#9AA8F5;--infobg:rgba(154,168,245,.14);
 --g1:rgba(15,143,132,.24);--g2:rgba(63,196,181,.12);--g3:rgba(15,143,132,.14);--chip:rgba(255,255,255,.06);--chip2:rgba(255,255,255,.1);
 --shadow:0 0 0 1px rgba(255,255,255,.015),0 16px 40px rgba(0,0,0,.4);--grad:linear-gradient(120deg,#0F8F84 0%,#3FC4B5 55%,#8EE3D8 100%);--gradText:linear-gradient(120deg,#3FC4B5 0%,#8EE3D8 100%);--gradBtn:linear-gradient(120deg,#075E56 0%,#0B7A70 100%);
 --warn:#FDBA74;--warnbg:rgba(251,146,60,.14);--up:#5FD3C6;--grid:rgba(255,255,255,.05);--tip:#E8EEEF;--tiptx:#121A1C;--stopA:#0F8F84;--stopB:#3FC4B5;--stopC:#8EE3D8;--rail:rgba(255,255,255,.03);--glow:rgba(63,196,181,.25)}
.ai *{box-sizing:border-box}
.ai a{color:var(--brand);text-decoration:none}
.card{background:var(--card);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--shadow)}
.gtext{background:var(--gradText);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:0 10px;line-height:24px;font-size:12px;color:var(--tx2);white-space:nowrap}
.btn-ai{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:0;border-radius:10px;background:var(--gradBtn);color:#FFFFFF;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 6px 18px var(--glow);white-space:nowrap}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:10px;background:var(--chip);color:var(--tx1);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn-ghost:hover{background:var(--chip2)}
.lift{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.lift:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(15,23,42,.04),0 18px 40px rgba(15,143,132,.12);border-color:rgba(15,143,132,.28)}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:56px;border:0;border-radius:12px;background:transparent;color:var(--tx2);font-size:12px;font-family:inherit;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.rb:hover{background:var(--chip);color:var(--tx1)}
.rb.on{background:var(--chip2);color:var(--tx1);font-weight:600}
.rb.on .ric{color:var(--brand)}
.pi{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;font-size:14px;color:var(--tx1) !important;white-space:nowrap;transition:background-color .15s ease}
.pi:hover{background:var(--chip)}
.tag{flex:none;font-size:12px;line-height:18px;border-radius:4px;padding:0 5px}
.cmd{padding:1.5px;border-radius:999px;background:var(--grad);box-shadow:0 8px 30px rgba(15,143,132,.18)}
.cmd-in{display:flex;align-items:center;gap:10px;height:42px;padding:0 8px 0 16px;border-radius:999px;background:var(--solid)}
.orb{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#FFFFFF 0%,rgba(255,255,255,0) 38%),var(--grad);box-shadow:0 0 18px rgba(15,143,132,.45);flex:none;animation:orb 4s ease-in-out infinite}
@keyframes orb{0%,100%{transform:scale(1);box-shadow:0 0 14px rgba(15,143,132,.35)}50%{transform:scale(1.06);box-shadow:0 0 24px rgba(15,143,132,.5)}}
.ins{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--chip)}
.ic{flex:none;width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.num{font-family:'DIN Alternate','Bahnschrift','SF Pro Display','Helvetica Neue',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ai :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.tabp{height:30px;padding:0 14px;border:0;border-radius:999px;font-size:14px;font-family:inherit;cursor:pointer;background:transparent;color:var(--tx2)}
.tabp.on{background:var(--solid);color:var(--tx1);font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.12)}
.kpi{display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:2px;padding:14px 16px 10px;border-radius:14px;border:1px solid transparent;background:var(--chip);font-family:inherit;cursor:pointer;color:var(--tx1);transition:border-color .15s ease,background-color .15s ease}
.kpi:hover{background:var(--chip2)}
.kpi.on{background:var(--solid);border-color:rgba(15,143,132,.35);box-shadow:0 8px 24px rgba(15,143,132,.12)}
.col{position:relative;flex:1;display:flex;justify-content:center}
.toast{position:absolute;z-index:40;padding:10px 14px;border-radius:12px;background:var(--tip);color:var(--tiptx);font-size:12px;line-height:1.6;box-shadow:0 12px 32px rgba(0,0,0,.2);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.orb{animation:none}.lift,.lift:hover{transition:none;transform:none}}
</style>
</helmet>
<div data-prd-root="1" style="position: relative; display: flex; align-items: stretch; background: #F7F8FC">
<div style="flex: 1 1 960px; min-width: 0; position: relative; z-index: 0; overflow: hidden">

<div class="{{rootClass}}" style="position: relative; min-height: 1940px; background: var(--bg); color: var(--tx1); font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px; overflow: hidden">

    <linearGradient id="ai-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--stopB); stop-opacity: .28"/><stop offset="1" style="stop-color: var(--stopB); stop-opacity: 0"/></linearGradient>
  </defs></svg>
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">

    <div style="position: absolute; right: -120px; top: -180px; width: 760px; height: 560px; border-radius: 50%; background: var(--g2); filter: blur(100px)"></div>
    <div style="position: absolute; left: 38%; top: 520px; width: 680px; height: 480px; border-radius: 50%; background: var(--g3); filter: blur(110px)"></div>
    <div style="position: absolute; inset: 0; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 40px 40px; -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 46%); mask-image: linear-gradient(180deg, #000 0%, transparent 46%)"></div>
  </div>

  <div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 8px 24px; background: #1F2329; color: #FFFFFF; font-size: 14px">

    <div style="display: flex; gap: 4px; background: rgba(255,255,255,.08); border-radius: 8px; padding: 3px">
      <template data-sc="for" list="{{todoModes}}" as="m" hint-placeholder-count="3"><button onClick="{{m.pick}}" aria-pressed="{{m.onStr}}" style="{{m.style}}">{{m.label}}</button></template>
    </div>
    <button onClick="{{replay}}" style=" height: 28px; padding: 0 12px; border: 1px solid #5FD3C6; border-radius: 6px; background: transparent; color: #5FD3C6; font-size: 12px; font-family: inherit; cursor: pointer">模拟首次登录</button>

  <div style="position: relative; display: flex; align-items: stretch; min-height: 1900px">

        <button onClick="{{r.pick}}" aria-pressed="{{r.onStr}}" title="{{r.tip}}" class="{{r.cls}}">
          <span class="ric" style="position: relative; display: inline-flex">
            <template data-sc="if" value="{{r.ic_fav}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></template><template data-sc="if" value="{{r.ic_home}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg></template><template data-sc="if" value="{{r.ic_goods}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg></template><template data-sc="if" value="{{r.ic_store}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5 5.5 4h13L20 9.5"/><path d="M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0"/><path d="M5.5 12v8h13v-8"/><path d="M10 20v-4h4v4"/></svg></template><template data-sc="if" value="{{r.ic_mall}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg></template><template data-sc="if" value="{{r.ic_mkt}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l6 4V6L7 10z"/><path d="M16.5 9a4 4 0 0 1 0 6"/><path d="M19 6.5a7.5 7.5 0 0 1 0 11"/></svg></template><template data-sc="if" value="{{r.ic_order}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8.5h6"/><path d="M9 12h6"/><path d="M9 15.5h3.5"/></svg></template><template data-sc="if" value="{{r.ic_qym}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2.5v2.5H14z"/><path d="M20 14v6h-6"/></svg></template><template data-sc="if" value="{{r.ic_fin}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg></template><template data-sc="if" value="{{r.ic_data}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16v-5"/><path d="M12 16V7"/><path d="M17 16v-8"/></svg></template>
            <template data-sc="if" value="{{r.dot}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: -3px; top: -2px; width: 7px; height: 7px; border-radius: 50%; background: #E5484D; box-shadow: 0 0 0 2px var(--solid)"></span></template>
          </span>
          <span>{{r.name}}</span>
        </button>
      </template>
      <button onClick="{{askAi}}" class="rb" style="margin-top: 12px; height: 64px" title="AI 助手（即将上线）">
        <span class="orb"></span><span class="gtext" style="font-weight: 600">AI 助手</span>
      </button>
    </nav>

    <aside data-prd="menu" aria-label="二级菜单" style="{{asideStyle}}">
      <div style="display: flex; align-items: center; gap: 6px; padding: 0 8px 12px">
        <span style="font-size: 16px; font-weight: 600">{{panelTitle}}</span>
        <template data-sc="if" value="{{panelHasHint}}" hint-placeholder-val="{{ false }}"><span class="chip">{{panelHint}}</span></template>
      </div>
      <template data-sc="for" list="{{panelSections}}" as="s" hint-placeholder-count="2">
        <div style="{{s.wrapStyle}}">
          <template data-sc="if" value="{{s.spot}}" hint-placeholder-val="{{ false }}"><div role="dialog" aria-label="更新指引" style="left: calc(100% + 22px); top: 0; position: absolute; width: 320px; z-index: 70; background: var(--solid); color: var(--tx1); border-radius: 14px; padding: 14px 18px 16px; box-shadow: 0 16px 40px rgba(0,0,0,.28); text-align: left; font-weight: 400; white-space: normal">
                  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px"><span style="font-size: 12px; font-weight: 600; color: var(--brand)">{{tStep}}</span><button onClick="{{tClose}}" aria-label="关闭指引" style="margin-left: auto; width: 24px; height: 24px; border: 0; background: transparent; color: var(--tx3); cursor: pointer; font-size: 16px">×</button></div>
                  <div style="font-size: 16px; font-weight: 600; margin-bottom: 6px">{{tTitle}}</div>
                  <div style="font-size: 14px; color: var(--tx2); line-height: 1.7">{{tDesc}}</div>
                  <div style="display: flex; align-items: center; gap: 8px; margin-top: 14px">
                    <button onClick="{{tClose}}" style="border: 0; background: transparent; color: var(--tx2); font-size: 14px; font-family: inherit; cursor: pointer; padding: 0">跳过</button>
                    <button onClick="{{tPrev}}" class="btn-ghost" style="{{tPrevStyle}}">上一步</button>
                    <button onClick="{{tNext}}" class="btn-ai" style="margin-left: 0">{{tNextLabel}}</button>
                  </div>
                </div></template>
          <template data-sc="if" value="{{s.hasTitle}}" hint-placeholder-val="{{ true }}"><div style="padding: 8px 10px 4px; font-size: 12px; color: var(--tx3)">{{s.title}}</div></template>

    </aside>

                  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px"><span style="font-size: 12px; font-weight: 600; color: var(--brand)">{{tStep}}</span><button onClick="{{tClose}}" aria-label="关闭指引" style="margin-left: auto; width: 24px; height: 24px; border: 0; background: transparent; color: var(--tx3); cursor: pointer; font-size: 16px">×</button></div>
                  <div style="font-size: 16px; font-weight: 600; margin-bottom: 6px">{{tTitle}}</div>
                  <div style="font-size: 14px; color: var(--tx2); line-height: 1.7">{{tDesc}}</div>
                  <div style="display: flex; align-items: center; gap: 8px; margin-top: 14px">
                    <button onClick="{{tClose}}" style="border: 0; background: transparent; color: var(--tx2); font-size: 14px; font-family: inherit; cursor: pointer; padding: 0">跳过</button>
                    <button onClick="{{tPrev}}" class="btn-ghost" style="{{tPrevStyle}}">上一步</button>
                    <button onClick="{{tNext}}" class="btn-ai" style="margin-left: 0">{{tNextLabel}}</button>
                  </div>
                </div></template>
          </div>
          <button class="btn-ghost" aria-label="消息">消息 <span class="num" style="font-size: 12px; color: #FFFFFF; background: #E5484D; border-radius: 999px; padding: 0 6px; line-height: 18px">3</span></button>

  prdMeasure() {
    const root = document.querySelector('[data-prd-root]');
    const box = document.querySelector('[data-prd-cards]');
    if (!root || !box) return;
    const rb = root.getBoundingClientRect();
    const sc = root.offsetWidth ? rb.width / root.offsetWidth : 1;
    const bb = box.getBoundingClientRect();
    const A = {};
    document.querySelectorAll('[data-prd]').forEach((el) => {
      const b = el.getBoundingClientRect();
      if (b.width < 2 || b.height < 2) return;
      A[el.getAttribute('data-prd')] = { x: (b.left - rb.left) / sc, y: (b.top - rb.top) / sc, w: b.width / sc, h: b.height / sc };
    });
    const H = {};
    document.querySelectorAll('[data-prd-card]').forEach((el) => { H[el.getAttribute('data-prd-card')] = el.offsetHeight; });
    const PX = (bb.left - rb.left) / sc, CY = (bb.top - rb.top) / sc;
    const key = JSON.stringify([A, H, Math.round(PX), Math.round(CY)]);
    if (key !== this._prdKey) { this._prdKey = key; this.setState({ prdA: A, prdH: H, prdPX: PX, prdCY: CY }); }
  }
  componentDidMount() { this.prdMeasure(); this._prdT = setInterval(() => this.prdMeasure(), 500); }
  componentWillUnmount() { clearInterval(this._prdT); }
  renderVals() { return Object.assign(this.pageVals(), this.prdVals()); }
  prdVals() {
    const st = this.state;
    const A = st.prdA || {}, H = st.prdH || {};
    const PX = st.prdPX || 0, CY = st.prdCY || 0;
    const focus = st.prdFocus || '';
    const cards = this.prdCards();
    const withA = cards.filter((c) => A[c.k]).sort((a, b) => A[a.k].y - A[b.k].y);
    const noA = cards.filter((c) => !A[c.k]);
    const order = withA.concat(noA);
    let y = 0; const pos = {};
    order.forEach((c) => {
      const want = A[c.k] ? Math.max(0, A[c.k].y - CY - 4) : y;
      const top = Math.max(want, y);
      pos[c.k] = top; y = top + (H[c.k] || 150) + 12;
    });
    const C1 = '#5B6BD5';
    const showLines = st.prdLines !== false;
    const prdLineList = !showLines ? [] : withA.map((c) => {
      const a = A[c.k];
      const op = focus ? (focus === c.k ? 1 : 0.15) : 0.6;
      const w = focus === c.k ? 2 : 1.5;
      const dash = w + 'px dashed ' + C1;
      const ax = a.x + a.w + 4, ay = a.y + Math.min(a.h / 2, 24);
      const gx = PX - 16, cy = CY + pos[c.k] + 20;
      return {
        box: 'position: absolute; left: ' + (a.x - 4) + 'px; top: ' + (a.y - 4) + 'px; width: ' + (a.w + 8) + 'px; height: ' + (a.h + 8) + 'px; border: ' + dash + '; border-radius: 8px; box-sizing: border-box; opacity: ' + op,
        s1: 'position: absolute; left: ' + Math.min(ax, gx) + 'px; top: ' + ay + 'px; width: ' + Math.abs(gx - ax) + 'px; border-top: ' + dash + '; opacity: ' + op,
        s2: 'position: absolute; left: ' + gx + 'px; top: ' + Math.min(ay, cy) + 'px; height: ' + Math.abs(cy - ay) + 'px; border-left: ' + dash + '; opacity: ' + op,
        s3: 'position: absolute; left: ' + gx + 'px; top: ' + cy + 'px; width: ' + (PX - gx) + 'px; border-top: ' + dash + '; opacity: ' + op,
        dot: 'position: absolute; left: ' + (ax - 4) + 'px; top: ' + (ay - 4) + 'px; width: 8px; height: 8px; border-radius: 50%; background: ' + C1 + '; opacity: ' + op
      };
    });
    const TAG = { '交互': ['#EEF2FF', '#3B4BB8'], '数据': ['#E8F6F4', '#0B6E66'], '规则': ['#F2F3F5', '#1F2329'], '埋点': ['#F5EDF7', '#7A2E78'], '待确认': ['#FFF1E8', '#B54708'], '字段': ['#E9F0FB', '#1F4E9A'] };
    const nums = {}; order.forEach((c, i) => { nums[c.k] = i + 1; });
    return {
      prdTitle: this.prdTitle(), prdIntro: this.prdIntro(),
      prdCardList: order.map((c) => {
        const on = focus === c.k;
        return {
          k: c.k, no: String(nums[c.k]), title: c.title,
          unanchored: !A[c.k], hint: c.hide || '当前界面未显示这个区域',
          secs: c.secs.map((x) => {

            return { isText: !isT, isTable: isT, label: lab, text: isT ? '' : x[1], caption: isT ? (x.caption || '') : '',
              rows: isT ? x.rows.map((r) => ({ f: r[0], d: r[1], s: r[2] || '' })) : [],
              tagStyle: 'flex: none; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 600; line-height: 20px; background: ' + tg[0] + '; color: ' + tg[1] };
          }),
          enter: () => this.setState({ prdFocus: c.k }), leave: () => this.setState({ prdFocus: '' }),
          style: 'position: absolute; left: 16px; right: 16px; top: ' + pos[c.k] + 'px; background: #FFFFFF; border-radius: 10px; padding: 12px 14px; box-sizing: border-box; border: 1px solid ' + (on ? C1 : '#E3E6F5') + '; box-shadow: ' + (on ? '0 4px 14px rgba(91,107,213,0.18)' : 'none')
        };
      }),
      prdLineList, prdPanelH: String(Math.max(y + 24, 400)),
      prdToggleLines: () => this.setState({ prdLines: st.prdLines === false }),
      prdLinesLabel: showLines ? '隐藏连线' : '显示连线'
    };
  }
