<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 工作台 · 视觉方向 · 会员端工作台精简改版 Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc-src">
<helmet>
<style>
.ai{--bg:#F4F7F7;--card:rgba(255,255,255,.76);--solid:#FFFFFF;--bd:rgba(15,23,42,.07);--tx1:#0F172A;--tx2:#566074;--tx3:#8A94A6;--brand:#0B7A70;--accent:#0B7A70;--info:#3B4BB8;--infobg:rgba(91,107,213,.12);
 --g1:rgba(15,143,132,.20);--g2:rgba(63,196,181,.14);--g3:rgba(15,143,132,.10);--chip:rgba(15,23,42,.045);--chip2:rgba(15,23,42,.08);
 --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(15,23,42,.06);--grad:linear-gradient(120deg,#0B7A70 0%,#0F8F84 50%,#4CC1B3 100%);--gradText:linear-gradient(120deg,#075E56 0%,#0B7A70 55%,#0F8F84 100%);--gradBtn:linear-gradient(120deg,#075E56 0%,#0B7A70 100%);
 --warn:#C2410C;--warnbg:rgba(234,88,12,.10);--up:#0B7A70;--grid:rgba(15,23,42,.045);--tip:#0F172A;--tiptx:#FFFFFF;--stopA:#0B7A70;--stopB:#0F8F84;--stopC:#4CC1B3;--rail:rgba(255,255,255,.62);--glow:rgba(15,143,132,.22)}
.ai.dark{--bg:#0A0F11;--card:rgba(255,255,255,.045);--solid:#121A1C;--bd:rgba(255,255,255,.08);--tx1:#E8EEEF;--tx2:#9AA7AA;--tx3:#66757A;--brand:#3FC4B5;--accent:#3FC4B5;--info:#9AA8F5;--infobg:rgba(154,168,245,.14);
 --g1:rgba(15,143,132,.24);--g2:rgba(63,196,181,.12);--g3:rgba(15,143,132,.14);--chip:rgba(255,255,255,.06);--chip2:rgba(255,255,255,.1);
 --shadow:0 0 0 1px rgba(255,255,255,.015),0 16px 40px rgba(0,0,0,.4);--grad:linear-gradient(120deg,#0F8F84 0%,#3FC4B5 55%,#8EE3D8 100%);--gradText:linear-gradient(120deg,#3FC4B5 0%,#8EE3D8 100%);--gradBtn:linear-gradient(120deg,#075E56 0%,#0B7A70 100%);
 --warn:#FDBA74;--warnbg:rgba(251,146,60,.14);--up:#5FD3C6;--grid:rgba(255,255,255,.05);--tip:#E8EEEF;--tiptx:#121A1C;--stopA:#0F8F84;--stopB:#3FC4B5;--stopC:#8EE3D8;--rail:rgba(255,255,255,.03);--glow:rgba(63,196,181,.25)}
.ai *{box-sizing:border-box}
.ai a{color:var(--brand);text-decoration:none}
.card{background:var(--card);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--shadow)}
.gtext{background:var(--gradText);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:0 10px;line-height:24px;font-size:12px;color:var(--tx2);white-space:nowrap}
.btn-ai{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:0;border-radius:10px;background:var(--gradBtn);color:#FFFFFF;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 6px 18px var(--glow);white-space:nowrap}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:10px;background:var(--chip);color:var(--tx1);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn-ghost:hover{background:var(--chip2)}
.lift{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.lift:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(15,23,42,.04),0 18px 40px rgba(15,143,132,.12);border-color:rgba(15,143,132,.28)}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:56px;border:0;border-radius:12px;background:transparent;color:var(--tx2);font-size:12px;font-family:inherit;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.rb:hover{background:var(--chip);color:var(--tx1)}
.rb.on{background:var(--chip2);color:var(--tx1);font-weight:600}
.rb.on .ric{color:var(--brand)}
.pi{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;font-size:14px;color:var(--tx1) !important;white-space:nowrap;transition:background-color .15s ease}
.pi:hover{background:var(--chip)}
.tag{flex:none;font-size:12px;line-height:18px;border-radius:4px;padding:0 5px}
.cmd{padding:1.5px;border-radius:999px;background:var(--grad);box-shadow:0 8px 30px rgba(15,143,132,.18)}
.cmd-in{display:flex;align-items:center;gap:10px;height:42px;padding:0 8px 0 16px;border-radius:999px;background:var(--solid)}
.orb{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#FFFFFF 0%,rgba(255,255,255,0) 38%),var(--grad);box-shadow:0 0 18px rgba(15,143,132,.45);flex:none;animation:orb 4s ease-in-out infinite}
@keyframes orb{0%,100%{transform:scale(1);box-shadow:0 0 14px rgba(15,143,132,.35)}50%{transform:scale(1.06);box-shadow:0 0 24px rgba(15,143,132,.5)}}
.ins{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--chip)}
.ic{flex:none;width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.num{font-family:'DIN Alternate','Bahnschrift','SF Pro Display','Helvetica Neue',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ai :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.tabp{height:30px;padding:0 14px;border:0;border-radius:999px;font-size:14px;font-family:inherit;cursor:pointer;background:transparent;color:var(--tx2)}
.tabp.on{background:var(--solid);color:var(--tx1);font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.12)}
.kpi{display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:2px;padding:14px 16px 10px;border-radius:14px;border:1px solid transparent;background:var(--chip);font-family:inherit;cursor:pointer;color:var(--tx1);transition:border-color .15s ease,background-color .15s ease}
.kpi:hover{background:var(--chip2)}
.kpi.on{background:var(--solid);border-color:rgba(15,143,132,.35);box-shadow:0 8px 24px rgba(15,143,132,.12)}
.col{position:relative;flex:1;display:flex;justify-content:center}
.toast{position:absolute;z-index:40;padding:10px 14px;border-radius:12px;background:var(--tip);color:var(--tiptx);font-size:12px;line-height:1.6;box-shadow:0 12px 32px rgba(0,0,0,.2);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.orb{animation:none}.lift,.lift:hover{transition:none;transform:none}}
</style>
</helmet>

<div class="{{rootClass}}" style="position: relative; min-height: 1940px; background: var(--bg); color: var(--tx1); font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px; overflow: hidden">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs>
    <linearGradient id="ai-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color: var(--stopA)"/><stop offset=".55" style="stop-color: var(--stopB)"/><stop offset="1" style="stop-color: var(--stopC)"/></linearGradient>
    <linearGradient id="ai-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--stopB); stop-opacity: .28"/><stop offset="1" style="stop-color: var(--stopB); stop-opacity: 0"/></linearGradient>
  </defs></svg>
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <div style="position: absolute; left: -160px; top: -220px; width: 720px; height: 620px; border-radius: 50%; background: var(--g1); filter: blur(90px)"></div>
    <div style="position: absolute; right: -120px; top: -180px; width: 760px; height: 560px; border-radius: 50%; background: var(--g2); filter: blur(100px)"></div>
    <div style="position: absolute; left: 38%; top: 520px; width: 680px; height: 480px; border-radius: 50%; background: var(--g3); filter: blur(110px)"></div>
    <div style="position: absolute; inset: 0; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 40px 40px; -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 46%); mask-image: linear-gradient(180deg, #000 0%, transparent 46%)"></div>
  </div>

  <div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 8px 24px; background: #1F2329; color: #FFFFFF; font-size: 14px">
    <span style="font-weight: 600">原型演示 · 视觉方向</span>
    <div style="display: flex; gap: 4px; background: rgba(255,255,255,.08); border-radius: 8px; padding: 3px">
      
      
    </div>
    <span style="color: #9BA5B9">AI 能力（问 AI、简报、推荐理由）均为预留，点击提示即将上线；数据为示意</span>
  </div>

  <div style="position: relative; display: flex; align-items: stretch; min-height: 1900px">
    <nav aria-label="模块" style="width: 76px; flex: none; display: flex; flex-direction: column; gap: 4px; padding: 14px 8px; background: var(--rail); border-right: 1px solid var(--bd); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px)">
      <div style="display: flex; justify-content: center; margin-bottom: 10px">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: var(--gradBtn); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 18px; font-weight: 700; box-shadow: 0 8px 20px rgba(15,143,132,.3)">采</div>
      </div>
      <template data-sc="for" list="{{rail}}" as="r" hint-placeholder-count="8">
        <button onClick="{{r.pick}}" aria-pressed="{{r.onStr}}" title="{{r.tip}}" class="{{r.cls}}">
          <span class="ric" style="position: relative; display: inline-flex">
            <template data-sc="if" value="{{r.ic_fav}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></template><template data-sc="if" value="{{r.ic_home}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg></template><template data-sc="if" value="{{r.ic_goods}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg></template><template data-sc="if" value="{{r.ic_store}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5 5.5 4h13L20 9.5"/><path d="M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0"/><path d="M5.5 12v8h13v-8"/><path d="M10 20v-4h4v4"/></svg></template><template data-sc="if" value="{{r.ic_mall}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg></template><template data-sc="if" value="{{r.ic_mkt}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l6 4V6L7 10z"/><path d="M16.5 9a4 4 0 0 1 0 6"/><path d="M19 6.5a7.5 7.5 0 0 1 0 11"/></svg></template><template data-sc="if" value="{{r.ic_order}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8.5h6"/><path d="M9 12h6"/><path d="M9 15.5h3.5"/></svg></template><template data-sc="if" value="{{r.ic_qym}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2.5v2.5H14z"/><path d="M20 14v6h-6"/></svg></template><template data-sc="if" value="{{r.ic_fin}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg></template><template data-sc="if" value="{{r.ic_data}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16v-5"/><path d="M12 16V7"/><path d="M17 16v-8"/></svg></template>
            <template data-sc="if" value="{{r.dot}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: -3px; top: -2px; width: 7px; height: 7px; border-radius: 50%; background: #E5484D; box-shadow: 0 0 0 2px var(--solid)"></span></template>
          </span>
          <span>{{r.name}}</span>
        </button>
      </template>
      <button onClick="{{askAi}}" class="rb" style="margin-top: 12px; height: 64px" title="AI 助手（即将上线）">
        <span class="orb"></span><span class="gtext" style="font-weight: 600">AI 助手</span>
      </button>
    </nav>

    <aside data-prd="menu" aria-label="二级菜单" style="width: 212px; flex: none; padding: 18px 12px; border-right: 1px solid var(--bd); background: var(--rail); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px)">
      <div style="display: flex; align-items: center; gap: 6px; padding: 0 8px 12px">
        <span style="font-size: 16px; font-weight: 600">{{panelTitle}}</span>
        <template data-sc="if" value="{{panelHasHint}}" hint-placeholder-val="{{ false }}"><span class="chip">{{panelHint}}</span></template>
      </div>
      <template data-sc="for" list="{{panelSections}}" as="s" hint-placeholder-count="2">
        <div style="margin-bottom: 8px">
          <template data-sc="if" value="{{s.hasTitle}}" hint-placeholder-val="{{ true }}"><div style="padding: 8px 10px 4px; font-size: 12px; color: var(--tx3)">{{s.title}}</div></template>
          <template data-sc="for" list="{{s.items}}" as="it" hint-placeholder-count="3">
            <a href="{{it.href}}" title="{{it.tip}}" class="pi"><span style="overflow: hidden; text-overflow: ellipsis">{{it.name}}</span><template data-sc="if" value="{{it.isNew}}" hint-placeholder-val="{{ false }}"><span class="tag" style="background: #C2410C; color: #FFFFFF; font-weight: 600">新</span></template><template data-sc="if" value="{{it.isRenamed}}" hint-placeholder-val="{{ false }}"><span class="tag" style="background: var(--chip2); color: var(--tx2)">改</span></template><template data-sc="if" value="{{it.isSoon}}" hint-placeholder-val="{{ false }}"><span class="tag" style="background: var(--chip); color: var(--tx3)">即将开放</span></template></a>
          </template>
        </div>
      </template>
      <div class="card" style="margin-top: 14px; padding: 14px; border-radius: 14px">
        <div style="display: flex; align-items: center; gap: 6px; font-weight: 600"><span class="gtext">◆</span>最高权益</div>
        <div style="font-size: 12px; color: var(--tx2); margin: 4px 0 8px; line-height: 18px">全部渠道可用 · 2027-06-30 到期</div>
        <a href="#" style="font-size: 12px; font-weight: 600">查看权益 →</a>
      </div>
    </aside>

    <main style="flex: 1; min-width: 0; padding: 18px 28px 48px">
      <header style="display: flex; align-items: center; gap: 16px; margin-bottom: 18px">
        <div style="min-width: 0">
          <div style="font-size: 12px; color: var(--tx3)">采发发 · 会员端</div>
          <div style="font-size: 20px; font-weight: 600">杭州飞象福利科技</div>
        </div>
        <div style="flex: 1; max-width: 560px; margin: 0 auto; position: relative">
          <div class="cmd"><div class="cmd-in">
            <span class="orb" style="width: 22px; height: 22px"></span>
            <input aria-label="问 AI" placeholder="问 AI：上周哪个商城转化最低？帮我把新货盘上架到 3 个商城…" onKeyDown="{{askAiKey}}" style="flex: 1; min-width: 0; height: 36px; border: 0; outline: none; background: transparent; color: var(--tx1); font-size: 14px; font-family: inherit">
            <span class="chip" style="background: var(--chip); line-height: 22px">⌘K</span>
            <button onClick="{{askAi}}" class="btn-ai" style="height: 32px; border-radius: 999px">发送</button>
          </div></div>
          <template data-sc="if" value="{{toastAi}}" hint-placeholder-val="{{ false }}"><div role="status" class="toast" style="left: 50%; transform: translateX(-50%); top: 52px">AI 助手即将上线：会先支持问数、生成周报和批量上架</div></template>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <button class="btn-ghost">更新指引<span style="width: 6px; height: 6px; border-radius: 50%; background: #E5484D"></span></button>
          <button class="btn-ghost" aria-label="消息">消息 <span class="num" style="font-size: 12px; color: #FFFFFF; background: #E5484D; border-radius: 999px; padding: 0 6px; line-height: 18px">3</span></button>
          <div style="width: 34px; height: 34px; border-radius: 50%; background: var(--chip2); display: flex; align-items: center; justify-content: center; font-weight: 600">飞</div>
        </div>
      </header>

      <div class="card" role="status" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; margin-bottom: 16px; border-radius: 14px">
        <span class="chip" style="background: var(--chip2); color: var(--tx1); font-weight: 600">入口更新</span>
        <span style="flex: 1; min-width: 0; color: var(--tx2)">「猫超代发」「其他代发」已合并到 <b style="color: var(--tx1)">订单 › 代发</b>；平台猫超 <b style="color: var(--tx1)">售后（含上门取件）</b> 和 <b style="color: var(--tx1)">理赔</b> 在 订单 › 售后理赔</span>
        <button class="btn-ghost" style="height: 30px">开始指引</button>
      </div>

      <div style="display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px">
        <section data-prd="brief" class="card" aria-labelledby="brief-h" style="padding: 20px 22px">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px">
            <span class="orb"></span>
            <h2 id="brief-h" style="margin: 0; font-size: 20px; font-weight: 600">下午好，今天有 <span class="gtext">3 件事</span> 值得先看</h2>
          </div>
          <p style="margin: 0 0 14px 38px; font-size: 12px; color: var(--tx3)">AI 简报 · 基于订单、货盘和 C 端埋点生成 · 11/24 14:00 更新</p>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <template data-sc="for" list="{{insights}}" as="n" hint-placeholder-count="3">
              <div class="ins">
                <span class="ic" style="{{n.icStyle}}"><template data-sc="if" value="{{n.i_ship}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg></template><template data-sc="if" value="{{n.i_loss}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18l-7 8.5V18l-4 2v-7.5z"/></svg></template><template data-sc="if" value="{{n.i_pallet}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg></template></span>
                <div style="flex: 1; min-width: 0">
                  <div style="font-weight: 600">{{n.title}}</div>
                  <div style="font-size: 12px; color: var(--tx2); margin-top: 2px">{{n.desc}}</div>
                </div>
                <button onClick="{{n.act}}" class="{{n.btnCls}}">{{n.cta}}</button>
              </div>
            </template>
          </div>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; position: relative">
            <span style="font-size: 12px; color: var(--tx3)">试试问：</span>
            <template data-sc="for" list="{{prompts}}" as="q" hint-placeholder-count="3">

    ].map((n) => ({ ...n, icStyle: tone[n.tone], btnCls: n.primary ? 'btn-ai' : 'btn-ghost', ['i_' + n.k]: true }));

    const todoRaw = [
      { k: 'pay', label: '待付款', num: 1, sub: '商城订单', tone: 'blue' },
      { k: 'ship', label: '待发货', num: 8, sub: '商城订单', tone: 'orange', urgent: true, flag: '3 单超 24h' },
      { k: 'drop', label: '代发待处理', num: 5, sub: '原猫超代发 2 · 其他代发 3', tone: 'teal' },
      { k: 'after', label: '售后 · 理赔', num: 1, sub: '平台猫超 · 含上门取件', tone: 'violet' },
      { k: 'change', label: '商品变更待确认', num: 3, sub: '代发商品下架 / 换品', tone: 'orange', urgent: true, flag: '影响代发' }
    ];
    const todos = todoRaw.map((t) => ({ ...t, num: String(t.num), urgent: !!t.urgent, ['t_' + t.k]: true, icStyle: tone[t.tone],
      style: 'display: flex; flex-direction: column; gap: 2px; padding: 14px; border-radius: 14px; background: var(--solid); border: 1px solid var(--bd); color: var(--tx1)',
      numStyle: 'font-size: 30px; font-weight: 700; line-height: 1.15; margin-top: 10px; color: ' + (t.urgent ? 'var(--warn)' : 'var(--tx1)') }));

    const pallets = [
      { name: '货盘上新 · 东方甄选', source: '飞象自营', count: 128, malls: 0, img: 'img/rice.jpg', alt: '柴火大院香稻贡米', tag: '新上架', tagBg: '#C2410C', reason: '同规模服务商上架率 62%，年货节福利热门' },
      { name: '坚果零食礼盒', source: '平台猫超', count: 86, malls: 3, img: 'img/cashew.png', alt: '三只松鼠炭烧腰果', reason: '你的员工近 30 天零食复购率 34%' },
      { name: '家清日用', source: '平台猫超', count: 52, malls: 1, img: 'img/bluemoon.jpg', alt: '蓝月亮洗衣液', reason: '高频复购品类，适合积分兑换' },
      { name: '暖冬关怀', source: '多渠道', count: 40, malls: 0, img: 'img/muji.jpg', alt: '无印良品冬被', tag: '暖冬专题', tagBg: 'rgba(15,23,42,.72)', reason: '12 月冬季慰问，建议提前 2 周上架' }
    ].map((p) => ({ ...p, hasTag: !!p.tag, tagStyle: 'font-size: 12px; font-weight: 600; color: #FFFFFF; border-radius: 999px; padding: 0 9px; line-height: 22px; background: ' + (p.tagBg || 'transparent') }));

    const days = ['11/16', '11/17', '11/18', '11/19', '11/20', '11/21', '11/22'];
    const money = (v) => '¥' + v.toLocaleString('en-US');
    const DATA = {
      mall: [
        { id: 'gmv', label: '商城 GMV', value: '¥18,640', delta: '↑ 13.5%', s: [2108, 2726, 2462, 3077, 2638, 3341, 2288], fmt: money },
        { id: 'ord', label: '支付订单数', value: '212', delta: '↑ 22 单', s: [24, 31, 28, 35, 30, 38, 26], fmt: (v) => v + ' 单' },
        { id: 'uv', label: '访问人数', behav: true, value: '1,286', delta: '↑ 14.8%', s: [168, 182, 171, 205, 176, 214, 170], fmt: (v) => v + ' 人' },
        { id: 'cvr', label: '兑换转化率', behav: true, value: '15.4%', delta: '↓ 0.6 pct', down: true, s: [15.1, 16.2, 15.8, 15.9, 15.2, 16.4, 13.8], fmt: (v) => v + '%' },
        { id: 'iss', label: '发放兑换率', value: '65.6%', delta: '↑ 4.8 pct', s: [58, 59.5, 61, 62.2, 63.4, 64.8, 65.6], fmt: (v) => v + '%' }
      ],
      drop: [
        { id: 'gmv', label: '代发金额', value: '¥42,380', delta: '↑ 8.2%', s: [5200, 6100, 5800, 6900, 5600, 7400, 5380], fmt: money },
        { id: 'ord', label: '代发订单', value: '96', delta: '↑ 9 单', s: [12, 14, 13, 16, 11, 18, 12], fmt: (v) => v + ' 单' },
        { id: 'fail', label: '下单失败', value: '4', delta: '↓ 2 单', s: [1, 0, 1, 0, 1, 1, 0], fmt: (v) => v + ' 单' },
        { id: 'after', label: '售后单', value: '3', delta: '持平', s: [0, 1, 0, 1, 0, 1, 0], fmt: (v) => v + ' 单' },
        { id: 'claim', label: '理赔金额', value: '¥268', delta: '↓ 12.0%', s: [0, 68, 0, 120, 0, 80, 0], fmt: money }
      ],
      bulk: [
        { id: 'gmv', label: '集采金额', value: '¥126,800', delta: '↑ 21.4%', s: [12000, 18800, 15200, 22400, 16800, 24600, 17000], fmt: money },
        { id: 'quote', label: '报价单', value: '3', delta: '↑ 1 张', s: [0, 1, 0, 1, 0, 1, 0], fmt: (v) => v + ' 张' },
        { id: 'conf', label: '客户已确认', value: '2', delta: '↑ 1 张', s: [0, 0, 1, 0, 0, 1, 0], fmt: (v) => v + ' 张' },
        { id: 'ord', label: '已下单', value: '1', delta: '持平', s: [0, 0, 0, 0, 0, 1, 0], fmt: (v) => v + ' 张' },
        { id: 'aov', label: '客单价', value: '¥42,267', delta: '↑ 6.1%', s: [40000, 41000, 40800, 41500, 41900, 42100, 42267], fmt: money }
      ]
    };
    const list = DATA[st.tab];
    const cur = list.find((k) => k.id === st.kpi) || list[0];
    const pathOf = (s, h, pad) => {
      const max = Math.max.apply(null, s), min = Math.min.apply(null, s);
      const rng = (max - min) || 1;
      return s.map((v, i) => [i / (s.length - 1) * 100, h - pad - (v - min) / rng * (h - pad * 2)]);
    };
    const smooth = (pts) => pts.map((p, i) => {
      if (!i) return 'M' + p[0].toFixed(2) + ' ' + p[1].toFixed(2);
      const a = pts[i - 1], cx = (a[0] + p[0]) / 2;
      return 'C' + cx.toFixed(2) + ' ' + a[1].toFixed(2) + ' ' + cx.toFixed(2) + ' ' + p[1].toFixed(2) + ' ' + p[0].toFixed(2) + ' ' + p[1].toFixed(2);
    }).join(' ');
    const kpis = list.map((k) => {
      const on = k.id === cur.id;
      return { ...k, behav: !!k.behav, selStr: on ? 'true' : 'false', cls: on ? 'kpi on' : 'kpi', spark: smooth(pathOf(k.s, 30, 3)),
        deltaStyle: 'font-size: 12px; font-weight: 600; color: ' + (k.down ? 'var(--warn)' : 'var(--up)'),
        pick: () => this.setState({ kpi: k.id, hover: -1 }) };
    });
    // main chart: baseline 0
    const max = Math.max.apply(null, cur.s) || 1;
    const niceTop = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const m = max / p; const n = m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10; return n * p; })();
    const n7 = cur.s.length;
    const pts = cur.s.map((v, i) => [(i + 0.5) / n7 * 100, 100 - v / niceTop * 92]);
    const mainLine = smooth(pts);
    const mainArea = mainLine + ' L' + pts[n7 - 1][0].toFixed(2) + ' 100 L' + pts[0][0].toFixed(2) + ' 100 Z';
    const ticks = [0, .25, .5, .75, 1].map((f) => {
      const v = niceTop * f, b = f * 92;
      return { text: cur.fmt(Math.round(v * 100) / 100).replace('.00', ''),
        line: 'position: absolute; left: 56px; right: 8px; bottom: ' + b + '%; border-top: 1px ' + (f ? 'dashed' : 'solid') + ' var(--chip2)',
        label: 'position: absolute; left: 0; width: 48px; text-align: right; bottom: ' + b + '%; transform: translateY(50%); font-size: 12px; color: var(--tx3); font-variant-numeric: tabular-nums' };
    });
    const points = cur.s.map((v, i) => {
      const on = st.hover === i;
      const y = v / niceTop * 92;
      return { on, date: days[i], text: cur.fmt(v),
        enter: () => this.setState({ hover: i }), leave: () => this.setState({ hover: -1 }),
        guide: on ? 'position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1px dashed var(--accent); opacity: .5' : 'display: none',
        dot: 'position: absolute; left: 50%; bottom: ' + y + '%; width: ' + (on ? 12 : 8) + 'px; height: ' + (on ? 12 : 8) + 'px; transform: translate(-50%, 50%); border-radius: 50%; background: var(--solid); border: 2px solid ' + (on ? 'var(--accent)' : 'var(--stopB)') + '; box-shadow: ' + (on ? '0 0 0 6px rgba(15,143,132,.18)' : 'none'),
        tipPos: 'left: 50%; bottom: calc(' + y + '% + 16px); transform: translateX(-50%)' };
    });
    const heroPts = pathOf(DATA.mall[0].s, 100, 10);
    const heroLine = smooth(heroPts);
    const last = heroPts[heroPts.length - 1];
    const fsteps = [['进入商城', 1286], ['浏览商详', 1040], ['加购 / 立即购买', 486], ['进入确认订单', 301], ['提交订单', 248], ['创单成功', 236], ['支付成功', 198]];
    const funnel = fsteps.map((f, i) => ({ label: f[0], value: f[1].toLocaleString('en-US'),
      conv: i ? (f[1] / fsteps[i - 1][1] * 100).toFixed(1) + '%' : '',
      convStyle: 'width: 46px; text-align: right; color: ' + (i === 2 ? 'var(--warn); font-weight: 700' : 'var(--tx3)'),
      bar: 'height: 6px; border-radius: 999px; background: var(--grad); width: ' + (f[1] / 1286 * 100) + '%' }));

    return {
      rootClass: dark ? 'ai dark' : 'ai',
      setLight: () => this.setState({ dark: false }), setDark: () => this.setState({ dark: true }),
      lightBtn: segBtn(!dark), darkBtn: segBtn(dark),
      rail, panelSections, panelTitle: curG.link ? '工作台' : curG.name, panelHint: curG.hint || '', panelHasHint: !!curG.hint && !curG.link,
      askAi: () => this.flash('ai'), askAiKey: (e) => { if (e && e.key === 'Enter') this.flash('ai'); },
      toastAi: st.toast === 'ai', toastSoon: st.toast === 'soon', toastBrief: st.toast === 'brief',
      briefToast: '一键上架即将上线：AI 会按你的商城和员工偏好推荐上架范围',
      showSoon: () => this.flash('soon'),
      insights, prompts: ['上周哪个商城转化最低？', '生成本月经营周报', '把东方甄选上架到 3 个商城'],
      todos, pallets, days,
      heroLine, heroArea: heroLine + ' L100 100 L0 100 Z',
      heroDot: 'position: absolute; right: 0; top: ' + last[1] + '%; width: 10px; height: 10px; transform: translate(50%, -50%); border-radius: 50%; background: var(--solid); border: 2px solid var(--stopC); box-shadow: 0 0 0 6px rgba(15,143,132,.18)',
      tabs: [['mall', '商城订单'], ['drop', '代发订单'], ['bulk', '集采订单']].map((b) => ({ label: b[1], sel: st.tab === b[0] ? 'true' : 'false', cls: st.tab === b[0] ? 'tabp on' : 'tabp', pick: () => this.setState({ tab: b[0], kpi: 'gmv', hover: -1 }) })),
      kpis, chartTitle: cur.label + ' · 每日趋势', mainLine, mainArea, ticks, points, funnel
    };
  }
}
</script>
</body>
